name: Test no fallback config when provider and model are empty
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When fallback-provider='' and fallback-model='', the "Write fallback AI config"
      # step is skipped (condition: inputs.fallback-provider != '' || inputs.fallback-model != '').
      # The config file should NOT be written.
      # continue-on-error: true lets us assert even if binary install fails under act.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          fallback-provider: ''
          fallback-model: ''
          dry-run: 'true'
          skip-labeled: 'false'

      - name: Assert fallback config file was NOT written
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          echo "Checking that config file does NOT exist at: $CONFIG_FILE"
          if [ -f "$CONFIG_FILE" ]; then
            echo "FAIL: config file unexpectedly found at $CONFIG_FILE"
            cat "$CONFIG_FILE"
            exit 1
          fi
          echo "PASS: config file correctly absent"

      - name: Assert metrics outputs are zero
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          CACHE_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_RATIO"
          if [ "$INPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected input-tokens=0, got '$INPUT_TOKENS'"
            exit 1
          fi
          if [ "$CACHE_RATIO" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio=n/a, got '$CACHE_RATIO'"
            exit 1
          fi
          echo "PASS"
