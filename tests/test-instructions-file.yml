name: Test instructions-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy instructions file
        run: |
          mkdir -p "$RUNNER_TEMP/instructions"
          echo "# PR Review Instructions\nReview all changes carefully." > "$RUNNER_TEMP/instructions/pr-review.md"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          instructions-file: '${{ runner.temp }}/instructions/pr-review.md'
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'

      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          # Under workflow_dispatch no AI steps run, so tokens should be 0
          if [ "$INPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected input-tokens=0, got $INPUT_TOKENS"
            exit 1
          fi
          if [ "$OUTPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected output-tokens=0, got $OUTPUT_TOKENS"
            exit 1
          fi
          if [ "$CACHE_HIT_RATIO" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio=n/a, got $CACHE_HIT_RATIO"
            exit 1
          fi
          echo "PASS: instructions-file input accepted and metrics outputs correct"
