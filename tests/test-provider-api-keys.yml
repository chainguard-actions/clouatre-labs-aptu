name: Test provider API key inputs accepted (no AI calls under workflow_dispatch)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: dummy-anthropic-key
          cerebras-api-key: dummy-cerebras-key
          gemini-api-key: dummy-gemini-key
          groq-api-key: dummy-groq-key
          openrouter-api-key: dummy-openrouter-key
          zai-api-key: dummy-zai-key
          zenmux-api-key: dummy-zenmux-key
          provider: gemini
          model: gemini-3.1-flash-lite
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'

      - name: Assert action ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert zero token usage (no AI step fires under workflow_dispatch)
        if: steps.action.outcome == 'success'
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          PR_REVIEW_OUTCOME: ${{ steps.action.outputs.pr-review-outcome }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          echo "pr-review-outcome: $PR_REVIEW_OUTCOME"
          if [ "$INPUT_TOKENS" != "0" ] || [ "$OUTPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected zero tokens"
            exit 1
          fi
          if [ "$CACHE_HIT_RATIO" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio n/a"
            exit 1
          fi
          if [ -n "$PR_REVIEW_OUTCOME" ]; then
            echo "FAIL: pr-review should not have run"
            exit 1
          fi
          echo "PASS"
