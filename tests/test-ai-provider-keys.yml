name: Test AI provider keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: "placeholder-anthropic-key"
          cerebras-api-key: "placeholder-cerebras-key"
          gemini-api-key: "placeholder-gemini-key"
          groq-api-key: "placeholder-groq-key"
          openrouter-api-key: "placeholder-openrouter-key"
          zai-api-key: "placeholder-zai-key"
          zenmux-api-key: "placeholder-zenmux-key"
          instructions-file: ".github/instructions/pr-review.md"
          dry-run: "true"
          no-comment: "true"
          apply-labels: "false"
          provider: "openrouter"
          model: "mistralai/mistral-small-2603"
          fallback-provider: "openrouter"
          fallback-model: "inception/mercury-2"

      - name: Assert action ran (metrics outputs present)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # The action may succeed or fail (e.g. if aptu binary install fails in harness)
          # but it must not produce an unexpected outcome
          if [ "$OUTCOME" = "success" ]; then
            # Metrics outputs should be set (even if zero)
            if [ -z "$INPUT_TOKENS" ] && [ -z "$OUTPUT_TOKENS" ]; then
              echo "FAIL: action succeeded but no metrics outputs were set"
              exit 1
            fi
            echo "PASS: action succeeded with metrics outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
