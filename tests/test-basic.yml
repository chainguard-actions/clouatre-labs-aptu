name: Test basic usage (install and metrics)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'

      - name: Assert action completed (success or graceful failure in act environment)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          ETU: ${{ steps.action.outputs.effective-token-units }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          echo "effective-token-units: $ETU"

          if [ "$OUTCOME" = "success" ]; then
            # Under workflow_dispatch with no issue/PR event, no AI calls are made.
            # Metrics should be zero / n/a defaults.
            if [ "$INPUT_TOKENS" != "0" ]; then
              echo "FAIL: expected input-tokens=0, got '$INPUT_TOKENS'"
              exit 1
            fi
            if [ "$OUTPUT_TOKENS" != "0" ]; then
              echo "FAIL: expected output-tokens=0, got '$OUTPUT_TOKENS'"
              exit 1
            fi
            if [ "$DURATION_MS" != "0" ]; then
              echo "FAIL: expected duration-ms=0, got '$DURATION_MS'"
              exit 1
            fi
            if [ "$CACHE_HIT_RATIO" != "n/a" ]; then
              echo "FAIL: expected cache-hit-ratio=n/a, got '$CACHE_HIT_RATIO'"
              exit 1
            fi
            if [ "$ETU" != "0" ]; then
              echo "FAIL: expected effective-token-units=0, got '$ETU'"
              exit 1
            fi
            echo "PASS: all metrics outputs are correct defaults"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (act environment limitation: gh attestation verify or actions/cache not available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
