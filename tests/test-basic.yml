name: Test basic usage (workflow_dispatch, no AI commands)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pre-install mock 'gh' and fake 'aptu' so the action's install steps
      # succeed without real network calls or SLSA attestation verification.
      - name: Install mock gh and prepare fake aptu tarball
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"

          # Determine arch (matches action logic)
          case "$(uname -m)" in
            aarch64 | arm64) ARCH="aarch64" ;;
            x86_64)          ARCH="x86_64"  ;;
            *) echo "Unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          FAKE_VERSION="0.10.1"
          ARCHIVE="aptu-cli-${FAKE_VERSION}-${ARCH}-unknown-linux-musl.tar.gz"

          # Build a fake aptu tarball from the committed fixture script
          STAGING=$(mktemp -d)
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-aptu.sh" "$STAGING/aptu"
          chmod +x "$STAGING/aptu"
          tar -czf "/tmp/${ARCHIVE}" -C "$STAGING" aptu
          rm -rf "$STAGING"

          # Build sha256 file (filename only — action does pushd before sha256sum -c)
          (cd /tmp && sha256sum "${ARCHIVE}") > "/tmp/${ARCHIVE%.tar.gz}.sha256"

          # Install mock gh from committed fixture
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-gh.sh" "$HOME/.local/bin/gh"
          chmod +x "$HOME/.local/bin/gh"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'

      # Under workflow_dispatch, no aptu commands run (all gated on issues/pull_request/schedule).
      # The metrics-aggregate step always runs and emits zero/n/a defaults.
      - name: Assert input-tokens output is 0
        env:
          ACTUAL: ${{ steps.action.outputs.input-tokens }}
        run: |
          echo "actual input-tokens: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected input-tokens=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert output-tokens output is 0
        env:
          ACTUAL: ${{ steps.action.outputs.output-tokens }}
        run: |
          echo "actual output-tokens: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected output-tokens=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert duration-ms output is 0
        env:
          ACTUAL: ${{ steps.action.outputs.duration-ms }}
        run: |
          echo "actual duration-ms: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected duration-ms=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert cache-hit-ratio output is n/a
        env:
          ACTUAL: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "actual cache-hit-ratio: $ACTUAL"
          if [ "$ACTUAL" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio=n/a, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert effective-token-units output is 0
        env:
          ACTUAL: ${{ steps.action.outputs.effective-token-units }}
        run: |
          echo "actual effective-token-units: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected effective-token-units=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
