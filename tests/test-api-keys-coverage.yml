name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy instructions file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures"
          echo "# PR Review Instructions" > "$GITHUB_WORKSPACE/hardened/tests/fixtures/pr-review.md"
          echo "Review all changes carefully." >> "$GITHUB_WORKSPACE/hardened/tests/fixtures/pr-review.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: "dummy-anthropic-key"
          cerebras-api-key: "dummy-cerebras-key"
          gemini-api-key: "dummy-gemini-key"
          groq-api-key: "dummy-groq-key"
          openrouter-api-key: "dummy-openrouter-key"
          zai-api-key: "dummy-zai-key"
          zenmux-api-key: "dummy-zenmux-key"
          instructions-file: "${{ github.workspace }}/hardened/tests/fixtures/pr-review.md"
          dry-run: "true"
          no-comment: "true"
          apply-labels: "false"
          skip-labeled: "false"
          pr-queue: "false"

      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # The action either succeeds (binary installed, no event-specific steps ran)
          # or fails gracefully (e.g. attestation verification fails in test env).
          # In both cases, the metrics-aggregate step runs (if: always()) and sets outputs.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            # Metrics outputs should always be set by the metrics-aggregate step
            # which runs with if: always(). When no AI calls were made, tokens = 0.
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio output was not set"
              exit 1
            fi
            echo "PASS: action ran (outcome=$OUTCOME) and metrics outputs are present"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
