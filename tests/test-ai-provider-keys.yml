name: Test AI provider API keys coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: "dummy-anthropic-key"
          cerebras-api-key: "dummy-cerebras-key"
          gemini-api-key: "dummy-gemini-key"
          groq-api-key: "dummy-groq-key"
          openrouter-api-key: "dummy-openrouter-key"
          zai-api-key: "dummy-zai-key"
          zenmux-api-key: "dummy-zenmux-key"
          instructions-file: ""
          dry-run: "true"
          no-comment: "true"
          apply-labels: "false"
          skip-labeled: "false"
          pr-queue: "false"

      - name: Assert action ran and metrics outputs are set
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # The action either succeeds (binary installed, no AI steps fired under workflow_dispatch)
          # or fails gracefully (sentinel repo / API rate limit). Either way, metrics outputs
          # must be set by the always() metrics-aggregate step.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

          # cache-hit-ratio is always set (either a percent or "n/a")
          if [ -z "$CACHE_HIT_RATIO" ]; then
            echo "FAIL: cache-hit-ratio output is empty"
            exit 1
          fi
          echo "PASS: cache-hit-ratio='$CACHE_HIT_RATIO'"
