name: Test fallback AI config is written
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          dry-run: 'true'

      # The "Write fallback AI config" step runs before binary installation,
      # so the config file should exist even if later steps fail.
      - name: Assert fallback config file exists
        if: always()
        run: |
          CONFIG="$HOME/.config/aptu/config.toml"
          echo "Checking for config at: $CONFIG"
          if [ ! -f "$CONFIG" ]; then
            echo "FAIL: fallback config file not found at $CONFIG"
            exit 1
          fi
          echo "PASS: config file exists"
          cat "$CONFIG"

      - name: Assert fallback config contains provider
        if: always()
        run: |
          CONFIG="$HOME/.config/aptu/config.toml"
          if ! grep -q 'openrouter' "$CONFIG"; then
            echo "FAIL: config does not contain 'openrouter'"
            cat "$CONFIG"
            exit 1
          fi
          echo "PASS: config contains provider"

      - name: Assert fallback config contains model
        if: always()
        run: |
          CONFIG="$HOME/.config/aptu/config.toml"
          if ! grep -q 'inception/mercury-2' "$CONFIG"; then
            echo "FAIL: config does not contain model 'inception/mercury-2'"
            cat "$CONFIG"
            exit 1
          fi
          echo "PASS: config contains model"

      - name: Assert fallback config has correct TOML structure
        if: always()
        run: |
          CONFIG="$HOME/.config/aptu/config.toml"
          if ! grep -q '\[ai.fallback\]' "$CONFIG"; then
            echo "FAIL: config does not contain [ai.fallback] section"
            cat "$CONFIG"
            exit 1
          fi
          echo "PASS: config has [ai.fallback] section"

      # Metrics should still be zeros since no AI calls were made
      - name: Assert metrics are zero
        if: always()
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          if [ "$INPUT_TOKENS" != "0" ] || [ "$OUTPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected zero metrics, got input=$INPUT_TOKENS output=$OUTPUT_TOKENS"
            exit 1
          fi
          echo "PASS"
