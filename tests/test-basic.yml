name: Test basic usage (workflow_dispatch, no AI calls)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake gh CLI to bypass binary download and attestation
        run: |
          mkdir -p "$HOME/.local/fake-bin"

          # Determine architecture name used by aptu releases
          ARCH=$(uname -m)
          case "$ARCH" in
            aarch64|arm64) ARCH_NAME="aarch64" ;;
            *) ARCH_NAME="x86_64" ;;
          esac
          VERSION="0.8.3"
          ARCHIVE="aptu-cli-${VERSION}-${ARCH_NAME}-unknown-linux-musl.tar.gz"

          cat > "$HOME/.local/fake-bin/gh" << 'GHSCRIPT'
          #!/bin/sh
          ARCH=$(uname -m)
          case "$ARCH" in
            aarch64|arm64) ARCH_NAME="aarch64" ;;
            *) ARCH_NAME="x86_64" ;;
          esac
          VERSION="0.8.3"
          ARCHIVE="aptu-cli-${VERSION}-${ARCH_NAME}-unknown-linux-musl.tar.gz"

          CMD="$1 $2"
          case "$CMD" in
            "api repos/clouatre-labs/aptu/releases")
              # Output the tag_name directly (gh api --jq extracts it)
              echo "v${VERSION}"
              exit 0
              ;;
            "release download")
              # Find -D argument for destination directory
              DIR=""
              PREV=""
              for arg in "$@"; do
                if [ "$PREV" = "-D" ]; then DIR="$arg"; fi
                PREV="$arg"
              done
              if [ -z "$DIR" ]; then
                echo "Error: -D flag not found" >&2
                exit 1
              fi
              # Create a minimal fake aptu binary
              printf '#!/bin/sh\necho "aptu fake v%s"\n' "$VERSION" > "$DIR/aptu"
              chmod +x "$DIR/aptu"
              # Create the tar.gz archive
              tar -czf "$DIR/$ARCHIVE" -C "$DIR" aptu
              # Create the sha256 checksum file
              (cd "$DIR" && sha256sum "$ARCHIVE" > "${ARCHIVE%.tar.gz}.sha256")
              exit 0
              ;;
            "attestation verify")
              echo "Attestation verification skipped (test mode)"
              exit 0
              ;;
          esac

          # Fall through to real gh for anything else
          if [ -x /usr/bin/gh ]; then
            exec /usr/bin/gh "$@"
          fi
          echo "gh: unhandled command: $*" >&2
          exit 1
          GHSCRIPT

          chmod +x "$HOME/.local/fake-bin/gh"
          echo "$HOME/.local/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'
          skip-labeled: 'false'

      - name: Assert input-tokens output is zero (no AI calls under workflow_dispatch)
        env:
          ACTUAL: ${{ steps.action.outputs.input-tokens }}
        run: |
          echo "actual input-tokens: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected input-tokens=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert output-tokens output is zero
        env:
          ACTUAL: ${{ steps.action.outputs.output-tokens }}
        run: |
          echo "actual output-tokens: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected output-tokens=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert duration-ms output is zero
        env:
          ACTUAL: ${{ steps.action.outputs.duration-ms }}
        run: |
          echo "actual duration-ms: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected duration-ms=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert cache-hit-ratio is n/a (no tokens consumed)
        env:
          ACTUAL: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "actual cache-hit-ratio: $ACTUAL"
          if [ "$ACTUAL" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio=n/a, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
