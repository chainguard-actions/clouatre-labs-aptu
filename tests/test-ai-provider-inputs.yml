name: Test AI provider inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create instructions file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures"
          cat > "$GITHUB_WORKSPACE/hardened/tests/fixtures/pr-review-instructions.md" <<'EOF'
          # PR Review Instructions
          Review for correctness and security.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: 'sk-ant-placeholder'
          cerebras-api-key: 'csk-placeholder'
          gemini-api-key: 'AIza-placeholder'
          groq-api-key: 'gsk_placeholder'
          openrouter-api-key: 'sk-or-placeholder'
          zai-api-key: 'zai-placeholder'
          zenmux-api-key: 'zmx-placeholder'
          instructions-file: 'hardened/tests/fixtures/pr-review-instructions.md'
          provider: 'openrouter'
          model: 'mistralai/mistral-small-2603'
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          skip-labeled: 'false'

      - name: Assert action ran (inputs accepted, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo / no real event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
