name: Test metrics defaults (no AI calls)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        # workflow_dispatch event: no issue/PR/schedule steps fire.
        # resolve-version will fail with a fake token, but metrics-aggregate
        # runs always() and emits zero-value outputs when no metrics file exists.
        continue-on-error: true
        with:
          github-token: fake-token-for-test
          dry-run: 'true'

      - name: Assert input-tokens output is set
        env:
          ACTUAL: ${{ steps.action.outputs.input-tokens }}
        run: |
          echo "input-tokens: '$ACTUAL'"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: input-tokens output is empty/unset"
            exit 1
          fi
          echo "PASS: input-tokens=$ACTUAL"

      - name: Assert output-tokens output is set
        env:
          ACTUAL: ${{ steps.action.outputs.output-tokens }}
        run: |
          echo "output-tokens: '$ACTUAL'"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: output-tokens output is empty/unset"
            exit 1
          fi
          echo "PASS: output-tokens=$ACTUAL"

      - name: Assert duration-ms output is set
        env:
          ACTUAL: ${{ steps.action.outputs.duration-ms }}
        run: |
          echo "duration-ms: '$ACTUAL'"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: duration-ms output is empty/unset"
            exit 1
          fi
          echo "PASS: duration-ms=$ACTUAL"

      - name: Assert cache-hit-ratio output is set
        env:
          ACTUAL: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "cache-hit-ratio: '$ACTUAL'"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: cache-hit-ratio output is empty/unset"
            exit 1
          fi
          echo "PASS: cache-hit-ratio=$ACTUAL"

      - name: Assert effective-token-units output is set
        env:
          ACTUAL: ${{ steps.action.outputs.effective-token-units }}
        run: |
          echo "effective-token-units: '$ACTUAL'"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: effective-token-units output is empty/unset"
            exit 1
          fi
          echo "PASS: effective-token-units=$ACTUAL"

      - name: Assert default metric values are zero
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          ETU: ${{ steps.action.outputs.effective-token-units }}
        run: |
          echo "Checking default zero values when no AI calls were made..."
          echo "input-tokens=$INPUT_TOKENS"
          echo "output-tokens=$OUTPUT_TOKENS"
          echo "duration-ms=$DURATION_MS"
          echo "cache-hit-ratio=$CACHE_HIT_RATIO"
          echo "effective-token-units=$ETU"

          if [ "$INPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected input-tokens=0, got '$INPUT_TOKENS'"
            exit 1
          fi
          if [ "$OUTPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected output-tokens=0, got '$OUTPUT_TOKENS'"
            exit 1
          fi
          if [ "$DURATION_MS" != "0" ]; then
            echo "FAIL: expected duration-ms=0, got '$DURATION_MS'"
            exit 1
          fi
          if [ "$CACHE_HIT_RATIO" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio=n/a, got '$CACHE_HIT_RATIO'"
            exit 1
          fi
          if [ "$ETU" != "0" ]; then
            echo "FAIL: expected effective-token-units=0, got '$ETU'"
            exit 1
          fi
          echo "PASS: all default metric values are correct"
