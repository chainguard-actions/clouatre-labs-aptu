name: Test fallback AI config is written
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'
          skip-labeled: 'false'
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'

      - name: Assert fallback config file was written
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          echo "Checking for config file at: $CONFIG_FILE"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: fallback config file not found at $CONFIG_FILE"
            exit 1
          fi
          echo "Config file contents:"
          cat "$CONFIG_FILE"
          # Verify it contains the expected provider
          if ! grep -q 'openrouter' "$CONFIG_FILE"; then
            echo "FAIL: config file does not contain 'openrouter'"
            exit 1
          fi
          # Verify it contains the expected model
          if ! grep -q 'inception/mercury-2' "$CONFIG_FILE"; then
            echo "FAIL: config file does not contain 'inception/mercury-2'"
            exit 1
          fi
          echo "PASS"

      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          CACHE_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_RATIO"
          if [ "$INPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected input-tokens=0, got '$INPUT_TOKENS'"
            exit 1
          fi
          if [ "$CACHE_RATIO" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio=n/a, got '$CACHE_RATIO'"
            exit 1
          fi
          echo "PASS"
