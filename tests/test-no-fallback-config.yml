name: Test no fallback config when fallback-provider is empty
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When fallback-provider='' and fallback-model='', the "Write fallback AI config"
      # step should be skipped (condition: inputs.fallback-provider != '' || inputs.fallback-model != '').
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          fallback-provider: ''
          fallback-model: ''
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'

      - name: Assert fallback config file was NOT written
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          if [ -f "$CONFIG_FILE" ]; then
            echo "Config file contents (unexpected):"
            cat "$CONFIG_FILE"
            echo "FAIL: config file should not exist when fallback-provider and fallback-model are empty"
            exit 1
          fi
          echo "PASS: config file correctly absent when fallback inputs are empty"

      - name: Assert action completed (success or graceful failure in act environment)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          if [ "$OUTCOME" = "success" ]; then
            if [ "$INPUT_TOKENS" != "0" ]; then
              echo "FAIL: expected input-tokens=0, got '$INPUT_TOKENS'"
              exit 1
            fi
            echo "PASS: action succeeded, no config file, metrics are zero"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (act environment limitation: gh attestation verify or actions/cache not available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
