name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          # AI provider API keys — all passed to satisfy input coverage
          anthropic-api-key: "dummy-anthropic-key"
          cerebras-api-key: "dummy-cerebras-key"
          gemini-api-key: "dummy-gemini-key"
          groq-api-key: "dummy-groq-key"
          openrouter-api-key: "dummy-openrouter-key"
          zai-api-key: "dummy-zai-key"
          zenmux-api-key: "dummy-zenmux-key"
          # PR review input
          instructions-file: ".github/instructions/pr-review.md"
          # Behavior flags — dry-run so no real changes are made
          dry-run: "true"
          no-comment: "true"
          apply-labels: "false"
          # Disable pr-queue to avoid extra API calls
          pr-queue: "false"

      - name: Assert action ran (metrics outputs present)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            # The metrics-aggregate step always runs (if: always()), so outputs should be set
            # Under workflow_dispatch no AI steps fire, so tokens should be 0 or empty
            echo "PASS: action ran with outcome '$OUTCOME' and metrics outputs are accessible"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
