name: Test basic usage (workflow_dispatch, defaults)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install gh CLI (not present in the act runner image)
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then gh --version; exit 0; fi
          GH_VER=2.63.2
          case "$(uname -m)" in
            aarch64|arm64) GH_ARCH=arm64 ;;
            *) GH_ARCH=amd64 ;;
          esac
          NAME="gh_${GH_VER}_linux_${GH_ARCH}"
          D="$RUNNER_TEMP/gh-install"
          mkdir -p "$D" "$RUNNER_TEMP/gh-bin"
          curl -fsSL -o "$D/${NAME}.tar.gz" "https://github.com/cli/cli/releases/download/v${GH_VER}/${NAME}.tar.gz"
          curl -fsSL -o "$D/checksums.txt" "https://github.com/cli/cli/releases/download/v${GH_VER}/gh_${GH_VER}_checksums.txt"
          (cd "$D" && grep " ${NAME}.tar.gz\$" checksums.txt | sha256sum -c -)
          tar -xzf "$D/${NAME}.tar.gz" -C "$D"
          install -m 0755 "$D/${NAME}/bin/gh" "$RUNNER_TEMP/gh-bin/gh"
          echo "$RUNNER_TEMP/gh-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gh-bin/gh" --version
      - name: Ensure no pre-existing aptu config
        run: rm -f "$HOME/.config/aptu/config.toml"
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
      - name: Assert fallback config written with defaults
        run: |
          CFG="$HOME/.config/aptu/config.toml"
          if [ ! -f "$CFG" ]; then
            echo "FAIL: $CFG not found"
            exit 1
          fi
          cat "$CFG"
          if ! grep -q '^\[ai.fallback\]$' "$CFG"; then
            echo "FAIL: missing [ai.fallback] section"
            exit 1
          fi
          if ! grep -qF 'chain = [{ provider = "openrouter", model = "inception/mercury-2" }]' "$CFG"; then
            echo "FAIL: default fallback chain not found"
            exit 1
          fi
          echo "PASS"
      - name: Assert aptu binary installed and on PATH
        run: |
          if [ ! -x "$HOME/.local/bin/aptu" ]; then
            echo "FAIL: $HOME/.local/bin/aptu missing or not executable"
            exit 1
          fi
          if ! command -v aptu >/dev/null 2>&1; then
            echo "FAIL: aptu not on PATH"
            echo "PATH=$PATH"
            exit 1
          fi
          aptu --version || true
          echo "PASS"
      - name: Assert PR review did not run under workflow_dispatch
        env:
          ACTUAL: ${{ steps.action.outputs.pr-review-outcome }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty pr-review-outcome"
            exit 1
          fi
          echo "PASS"
