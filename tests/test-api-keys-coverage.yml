name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy instructions file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures"
          echo "# PR Review Instructions" > "$GITHUB_WORKSPACE/hardened/tests/fixtures/pr-review-instructions.md"
          echo "Review for correctness and security." >> "$GITHUB_WORKSPACE/hardened/tests/fixtures/pr-review-instructions.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: 'placeholder-anthropic-key'
          cerebras-api-key: 'placeholder-cerebras-key'
          gemini-api-key: 'placeholder-gemini-key'
          groq-api-key: 'placeholder-groq-key'
          openrouter-api-key: 'placeholder-openrouter-key'
          zai-api-key: 'placeholder-zai-key'
          zenmux-api-key: 'placeholder-zenmux-key'
          instructions-file: 'hardened/tests/fixtures/pr-review-instructions.md'
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          skip-labeled: 'false'
          provider: 'openrouter'
          model: 'mistralai/mistral-small-2603'

      - name: Assert action ran (inputs accepted, or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real API keys or on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
