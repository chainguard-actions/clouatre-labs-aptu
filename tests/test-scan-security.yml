name: Test scan-security step is triggered by scan-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal file to scan
      - name: Create scan target directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/scan-target"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/scan-target/example.py" << 'EOF'
          # Example Python file for security scanning
          import os
          def read_file(path):
              with open(path, 'r') as f:
                  return f.read()
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          scan-path: '${{ github.workspace }}/tests/fixtures/scan-target'
          fail-on: ''
          sarif-upload: 'false'
          dry-run: 'true'
          skip-labeled: 'false'
        continue-on-error: true

      - name: Assert action ran with scan-path set
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The scan-security step fires when scan-path is set.
          # Without an AI API key, aptu scan-security will fail (no provider configured).
          # The step has continue-on-error: true when fail-on is empty, so the action
          # itself may still succeed. Either outcome is acceptable under harness constraints.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with scan-path (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
