name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          # AI provider API keys — all passed to satisfy input coverage
          anthropic-api-key: 'placeholder-anthropic'
          cerebras-api-key: 'placeholder-cerebras'
          gemini-api-key: 'placeholder-gemini'
          groq-api-key: 'placeholder-groq'
          openrouter-api-key: 'placeholder-openrouter'
          zai-api-key: 'placeholder-zai'
          zenmux-api-key: 'placeholder-zenmux'
          # instructions-file input coverage
          instructions-file: 'AGENTS.md'
          # Behavior flags
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          skip-labeled: 'false'
          # Disable fallback to avoid extra config noise
          fallback-provider: ''
          fallback-model: ''

      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # The action either succeeds (no issue/PR event, so most steps are skipped)
          # or fails gracefully (sentinel repo). Either way, metrics-aggregate always runs.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            # metrics-aggregate always runs (if: always()), so outputs must be set
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio output not set"
              exit 1
            fi
            echo "PASS: action ran and metrics outputs are present"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
