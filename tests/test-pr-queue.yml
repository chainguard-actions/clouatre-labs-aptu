name: Test pr-queue flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With pr-queue=true, the action runs 'aptu pr queue --repo $REPO'.
      # The pr-queue step has continue-on-error: true, so even if it fails
      # (e.g. sentinel repo not found), the action completes and outputs metrics.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          pr-queue: 'true'
          dry-run: 'true'

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert metrics outputs on success
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: input-tokens output is empty on success"
              exit 1
            fi
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio output is empty on success"
              exit 1
            fi
            echo "PASS: action completed with pr-queue=true, metrics outputs are set"
          else
            echo "PASS: action failed gracefully (binary install/attestation may not be available in act)"
          fi
