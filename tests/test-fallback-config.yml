name: Test fallback AI config writing
on:
  workflow_dispatch:

jobs:
  test-fallback-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action with a custom fallback provider and model.
      # The 'Write fallback AI config' step should create $HOME/.config/aptu/config.toml
      # with the specified provider and model. We use workflow_dispatch so no AI
      # command steps run, and continue-on-error since the binary download may fail.
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          fallback-provider: 'groq'
          fallback-model: 'llama-3.1-8b-instant'
          dry-run: 'true'
          no-comment: 'true'
        continue-on-error: true

      - name: Assert fallback config file was created
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          echo "Checking for config file at: $CONFIG_FILE"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: config file not found at $CONFIG_FILE"
            exit 1
          fi
          echo "Config file contents:"
          cat "$CONFIG_FILE"
          echo "PASS: config file exists"

      - name: Assert fallback config contains correct provider
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          if ! grep -q 'provider = "groq"' "$CONFIG_FILE"; then
            echo "FAIL: config does not contain provider = \"groq\""
            cat "$CONFIG_FILE"
            exit 1
          fi
          echo "PASS: provider is correct"

      - name: Assert fallback config contains correct model
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          if ! grep -q 'model = "llama-3.1-8b-instant"' "$CONFIG_FILE"; then
            echo "FAIL: config does not contain model = \"llama-3.1-8b-instant\""
            cat "$CONFIG_FILE"
            exit 1
          fi
          echo "PASS: model is correct"

      - name: Assert fallback config has correct TOML structure
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          if ! grep -q '\[ai.fallback\]' "$CONFIG_FILE"; then
            echo "FAIL: config does not contain [ai.fallback] section"
            cat "$CONFIG_FILE"
            exit 1
          fi
          echo "PASS: TOML structure is correct"

      - name: Assert metrics outputs are present with defaults
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          if [ "$INPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected input-tokens=0, got '$INPUT_TOKENS'"
            exit 1
          fi
          if [ "$CACHE_HIT_RATIO" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio=n/a, got '$CACHE_HIT_RATIO'"
            exit 1
          fi
          echo "PASS"
