name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: 'dummy-anthropic-key'
          cerebras-api-key: 'dummy-cerebras-key'
          gemini-api-key: 'dummy-gemini-key'
          groq-api-key: 'dummy-groq-key'
          openrouter-api-key: 'dummy-openrouter-key'
          zai-api-key: 'dummy-zai-key'
          zenmux-api-key: 'dummy-zenmux-key'
          instructions-file: '.github/instructions/pr-review.md'
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          pr-queue: 'false'

      - name: Assert action ran (inputs accepted, outcome is success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with all API key inputs and instructions-file accepted (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
