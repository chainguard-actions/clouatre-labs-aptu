name: Test provider API keys and instructions-file inputs (workflow_dispatch, no AI calls)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake gh wrapper to mock aptu binary installation
        run: |
          mkdir -p /tmp/fake-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-gh.sh" /tmp/fake-bin/gh
          chmod +x /tmp/fake-bin/gh
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: dummy-anthropic-key
          cerebras-api-key: dummy-cerebras-key
          gemini-api-key: dummy-gemini-key
          groq-api-key: dummy-groq-key
          openrouter-api-key: dummy-openrouter-key
          zai-api-key: dummy-zai-key
          zenmux-api-key: dummy-zenmux-key
          provider: gemini
          model: gemini-3.1-flash-lite
          instructions-file: AGENTS.md
          dry-run: 'true'

      - name: Assert action ran without invoking AI (no PR/issue event)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          PR_REVIEW_OUTCOME: ${{ steps.action.outputs.pr-review-outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          echo "pr-review-outcome: $PR_REVIEW_OUTCOME"
          if [ -n "$PR_REVIEW_OUTCOME" ]; then
            echo "FAIL: PR review should not run under workflow_dispatch"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            if [ "$INPUT_TOKENS" != "0" ] || [ "$OUTPUT_TOKENS" != "0" ]; then
              echo "FAIL: expected zero token usage, no AI step should run"
              exit 1
            fi
            if [ "$CACHE_HIT_RATIO" != "n/a" ]; then
              echo "FAIL: expected cache-hit-ratio=n/a"
              exit 1
            fi
            echo "PASS: action succeeded with zero-usage metrics"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (infrastructure issue in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
