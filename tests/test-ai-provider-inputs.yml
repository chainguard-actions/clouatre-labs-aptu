name: Test AI provider inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          # AI provider API keys (all uncovered inputs)
          anthropic-api-key: 'sk-ant-placeholder'
          cerebras-api-key: 'csk-placeholder'
          gemini-api-key: 'AIza-placeholder'
          groq-api-key: 'gsk_placeholder'
          openrouter-api-key: 'sk-or-placeholder'
          zai-api-key: 'zai-placeholder'
          zenmux-api-key: 'zmx-placeholder'
          # instructions-file coverage (point to a real fixture file)
          instructions-file: 'hardened/tests/fixtures/pr-review-instructions.md'
          # Use dry-run to avoid any side effects
          dry-run: 'true'
          # No-comment to avoid posting to GitHub
          no-comment: 'true'
          # Disable pr-queue to avoid API calls
          pr-queue: 'false'
          # No scan path so scan step is skipped
          scan-path: ''

      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # Under workflow_dispatch no AI steps fire, so tokens should be 0
          if [ "$INPUT_TOKENS" != "0" ] && [ -z "$INPUT_TOKENS" ]; then
            echo "FAIL: expected input-tokens to be set (got empty)"
            exit 1
          fi
          if [ "$OUTPUT_TOKENS" != "0" ] && [ -z "$OUTPUT_TOKENS" ]; then
            echo "FAIL: expected output-tokens to be set (got empty)"
            exit 1
          fi
          if [ "$DURATION_MS" != "0" ] && [ -z "$DURATION_MS" ]; then
            echo "FAIL: expected duration-ms to be set (got empty)"
            exit 1
          fi
          if [ -z "$CACHE_HIT_RATIO" ]; then
            echo "FAIL: expected cache-hit-ratio to be set"
            exit 1
          fi
          echo "PASS: all metric outputs are present"
