name: Test skip-labeled false when no labels present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With skip-labeled=true but no issue labels (workflow_dispatch has no issue context),
      # the action should NOT skip — it should proceed normally.
      # Under workflow_dispatch, no issue/PR steps fire, so the action just installs aptu
      # and outputs zero metrics.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          skip-labeled: 'true'
          dry-run: 'true'

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert metrics outputs on success
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          if [ "$OUTCOME" = "success" ]; then
            # When skip-labeled=true but no labels exist, skip=false, action proceeds
            # metrics-aggregate always runs (if: always()) and outputs zeros
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: input-tokens output is empty — action may have been skipped unexpectedly"
              exit 1
            fi
            if [ "$INPUT_TOKENS" != "0" ]; then
              echo "FAIL: expected input-tokens=0 (no AI calls under workflow_dispatch), got '$INPUT_TOKENS'"
              exit 1
            fi
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio output is empty"
              exit 1
            fi
            echo "PASS: action ran with skip-labeled=true, no labels → did not skip, metrics=0"
          else
            echo "PASS: action failed gracefully (binary install/attestation may not be available in act)"
          fi
