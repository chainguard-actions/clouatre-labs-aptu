name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: 'test-anthropic-key'
          cerebras-api-key: 'test-cerebras-key'
          gemini-api-key: 'test-gemini-key'
          groq-api-key: 'test-groq-key'
          openrouter-api-key: 'test-openrouter-key'
          zai-api-key: 'test-zai-key'
          zenmux-api-key: 'test-zenmux-key'
          instructions-file: ''
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          skip-labeled: 'false'
          fallback-provider: ''
          fallback-model: ''

      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # The action may fail at the resolve-version step (API call) or succeed
          # Either way, the metrics-aggregate step runs (if: always()) and sets outputs
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            # Metrics outputs should be set (either real values or zeros from the else branch)
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio output was not set"
              exit 1
            fi
            echo "PASS: action ran and metrics outputs are present"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
