name: Test skip-labeled flag behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test skip-labeled=true with no labels (should NOT skip)
        id: action-no-skip
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          skip-labeled: 'true'
          dry-run: 'true'
          # Under workflow_dispatch, github.event.issue.labels is empty/null,
          # so HAS_TYPE and HAS_PRIORITY are both false → skip=false

      - name: Assert action ran (not skipped) with skip-labeled=true and no labels
        env:
          OUTCOME: ${{ steps.action-no-skip.outcome }}
          INPUT_TOKENS: ${{ steps.action-no-skip.outputs.input-tokens }}
          CACHE_HIT_RATIO: ${{ steps.action-no-skip.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: input-tokens output is empty — action may have been incorrectly skipped"
              exit 1
            fi
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio output is empty"
              exit 1
            fi
            echo "PASS: action ran (not skipped) and metrics outputs are set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (binary install may not be supported in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Test skip-labeled=false (should always run)
        id: action-skip-false
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          skip-labeled: 'false'
          dry-run: 'true'

      - name: Assert action ran with skip-labeled=false
        env:
          OUTCOME: ${{ steps.action-skip-false.outcome }}
          INPUT_TOKENS: ${{ steps.action-skip-false.outputs.input-tokens }}
          CACHE_HIT_RATIO: ${{ steps.action-skip-false.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: input-tokens output is empty"
              exit 1
            fi
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio output is empty"
              exit 1
            fi
            echo "PASS: action ran with skip-labeled=false and metrics outputs are set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (binary install may not be supported in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
