name: Test pr-queue disabled (default false)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake gh CLI to bypass binary download and attestation
        run: |
          mkdir -p "$HOME/.local/fake-bin"

          cat > "$HOME/.local/fake-bin/gh" << 'GHSCRIPT'
          #!/bin/sh
          ARCH=$(uname -m)
          case "$ARCH" in
            aarch64|arm64) ARCH_NAME="aarch64" ;;
            *) ARCH_NAME="x86_64" ;;
          esac
          VERSION="0.8.3"
          ARCHIVE="aptu-cli-${VERSION}-${ARCH_NAME}-unknown-linux-musl.tar.gz"

          CMD="$1 $2"
          case "$CMD" in
            "api repos/clouatre-labs/aptu/releases")
              echo "v${VERSION}"
              exit 0
              ;;
            "release download")
              DIR=""
              PREV=""
              for arg in "$@"; do
                if [ "$PREV" = "-D" ]; then DIR="$arg"; fi
                PREV="$arg"
              done
              if [ -z "$DIR" ]; then
                echo "Error: -D flag not found" >&2
                exit 1
              fi
              printf '#!/bin/sh\necho "aptu fake v%s"\n' "$VERSION" > "$DIR/aptu"
              chmod +x "$DIR/aptu"
              tar -czf "$DIR/$ARCHIVE" -C "$DIR" aptu
              (cd "$DIR" && sha256sum "$ARCHIVE" > "${ARCHIVE%.tar.gz}.sha256")
              exit 0
              ;;
            "attestation verify")
              echo "Attestation verification skipped (test mode)"
              exit 0
              ;;
          esac

          if [ -x /usr/bin/gh ]; then
            exec /usr/bin/gh "$@"
          fi
          echo "gh: unhandled command: $*" >&2
          exit 1
          GHSCRIPT

          chmod +x "$HOME/.local/fake-bin/gh"
          echo "$HOME/.local/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          pr-queue: 'false'
          dry-run: 'true'
          skip-labeled: 'false'

      - name: Assert metrics outputs are zero (pr-queue disabled, no AI calls)
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          ETU: ${{ steps.action.outputs.effective-token-units }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_RATIO"
          echo "effective-token-units: $ETU"

          FAIL=0
          if [ "$INPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected input-tokens=0, got '$INPUT_TOKENS'"
            FAIL=1
          fi
          if [ "$OUTPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected output-tokens=0, got '$OUTPUT_TOKENS'"
            FAIL=1
          fi
          if [ "$DURATION_MS" != "0" ]; then
            echo "FAIL: expected duration-ms=0, got '$DURATION_MS'"
            FAIL=1
          fi
          if [ "$CACHE_RATIO" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio=n/a, got '$CACHE_RATIO'"
            FAIL=1
          fi
          if [ "$ETU" != "0" ]; then
            echo "FAIL: expected effective-token-units=0, got '$ETU'"
            FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then
            exit 1
          fi
          echo "PASS: all metrics are zero as expected"
