name: Test skip-labeled=false disables skip logic
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          skip-labeled: 'false'
          dry-run: 'true'

      # With skip-labeled=false, the check-skip step never sets skip=true.
      # The action should complete normally with zero metrics (no AI event).
      # The metrics-aggregate step runs with if: always() so outputs are always set.
      - name: Assert input-tokens is 0
        if: always()
        env:
          ACTUAL: ${{ steps.action.outputs.input-tokens }}
        run: |
          echo "actual input-tokens: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected input-tokens=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert cache-hit-ratio is n/a
        if: always()
        env:
          ACTUAL: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "actual cache-hit-ratio: $ACTUAL"
          if [ "$ACTUAL" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio=n/a, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
