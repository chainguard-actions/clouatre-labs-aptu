name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy instructions file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/instructions"
          echo "# PR Review Instructions\nReview code carefully." > "$GITHUB_WORKSPACE/.github/instructions/pr-review.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: 'sk-ant-fake-key-for-coverage'
          cerebras-api-key: 'fake-cerebras-key-for-coverage'
          gemini-api-key: 'fake-gemini-key-for-coverage'
          groq-api-key: 'fake-groq-key-for-coverage'
          openrouter-api-key: 'fake-openrouter-key-for-coverage'
          zai-api-key: 'fake-zai-key-for-coverage'
          zenmux-api-key: 'fake-zenmux-key-for-coverage'
          instructions-file: '.github/instructions/pr-review.md'
          dry-run: 'true'
          no-comment: 'true'
          pr-queue: 'false'
          scan-path: ''

      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # The action should either succeed or fail gracefully (sentinel repo / no event)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

          # metrics-aggregate always runs (if: always()), so outputs must be set
          if [ -z "$INPUT_TOKENS" ]; then
            echo "FAIL: input-tokens output is empty"
            exit 1
          fi
          if [ -z "$CACHE_HIT_RATIO" ]; then
            echo "FAIL: cache-hit-ratio output is empty"
            exit 1
          fi
          echo "PASS: all expected outputs are present"
