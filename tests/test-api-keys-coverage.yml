name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy instructions file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures"
          echo "# PR Review Instructions" > "$GITHUB_WORKSPACE/hardened/tests/fixtures/pr-review-instructions.md"
          echo "Review for correctness and security." >> "$GITHUB_WORKSPACE/hardened/tests/fixtures/pr-review-instructions.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          # AI provider API keys (all optional; passing empty strings for coverage)
          anthropic-api-key: ''
          cerebras-api-key: ''
          gemini-api-key: ''
          groq-api-key: ''
          openrouter-api-key: ''
          zai-api-key: ''
          zenmux-api-key: ''
          # instructions-file coverage
          instructions-file: hardened/tests/fixtures/pr-review-instructions.md
          # Use dry-run and no-comment to minimize side effects
          dry-run: 'true'
          no-comment: 'true'
          skip-labeled: 'false'
          # pr-queue won't fire on workflow_dispatch without pull_request event,
          # but passing it exercises the input path
          pr-queue: 'false'

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          if [ "$OUTCOME" = "success" ]; then
            # Metrics outputs should be set (even if zero)
            if [ -z "$INPUT_TOKENS" ] && [ -z "$OUTPUT_TOKENS" ] && [ -z "$DURATION_MS" ]; then
              echo "FAIL: action succeeded but all metric outputs are empty"
              exit 1
            fi
            echo "PASS: action succeeded with metric outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo or missing API keys)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
