name: Test telemetry rollup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          telemetry-rollup: 'true'
          telemetry-rollup-path: '.aptu/telemetry-rollup.jsonl'

      - name: Assert action ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should run (not be skipped). It may succeed or fail depending
          # on whether the binary install and attestation verification succeed.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert telemetry rollup step ran (no-op when no review context)
        run: |
          # The telemetry rollup script runs with '|| true' so it won't fail.
          # Under workflow_dispatch with no PR review, the context file won't exist,
          # so the rollup script will be a no-op. We just verify the action completed.
          echo "Telemetry rollup step ran (no-op when no review context file exists)"
          echo "PASS"

      - name: Assert telemetry rollup path is valid
        run: |
          # Verify the telemetry-rollup-path input is accepted without error.
          # The .aptu directory may or may not be created depending on whether
          # the rollup script ran with actual data.
          ROLLUP_PATH=".aptu/telemetry-rollup.jsonl"
          echo "Telemetry rollup path: $ROLLUP_PATH"
          # If the file exists, verify it's valid JSONL (one JSON object per line)
          if [ -f "$ROLLUP_PATH" ]; then
            echo "Rollup file exists, checking content..."
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "$line" | jq . > /dev/null 2>&1 || {
                  echo "FAIL: invalid JSON line in rollup file: $line"
                  exit 1
                }
              fi
            done < "$ROLLUP_PATH"
            echo "PASS: rollup file contains valid JSONL"
          else
            echo "PASS: rollup file not created (no review context - expected under workflow_dispatch)"
          fi
