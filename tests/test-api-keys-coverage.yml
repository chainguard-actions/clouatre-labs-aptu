name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy instructions file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/instructions"
          echo "# PR Review Instructions" > "$GITHUB_WORKSPACE/.github/instructions/pr-review.md"
          echo "Review all changes carefully." >> "$GITHUB_WORKSPACE/.github/instructions/pr-review.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: "sk-ant-placeholder-for-coverage"
          gemini-api-key: "AIza-placeholder-for-coverage"
          openrouter-api-key: "sk-or-placeholder-for-coverage"
          zai-api-key: "zai-placeholder-for-coverage"
          instructions-file: ".github/instructions/pr-review.md"
          provider: "openrouter"
          model: "mistralai/mistral-small-2603"
          fallback-provider: "openrouter"
          fallback-model: "inception/mercury-2"
          dry-run: "true"
          no-comment: "true"
          apply-labels: "false"
          skip-labeled: "false"

      - name: Assert action completed (setup steps ran)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch, no AI steps fire, so the action should succeed
          # (it installs aptu and exits cleanly). A failure here means setup broke.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo / no real event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
