name: Test instructions-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a sample instructions file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/instructions"
          cat > "$GITHUB_WORKSPACE/.github/instructions/pr-review.md" <<'EOF'
          # PR Review Instructions
          Please review the PR for correctness and style.
          EOF
          echo "Instructions file created"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          instructions-file: '.github/instructions/pr-review.md'
          dry-run: 'true'
          no-comment: 'true'
          skip-labeled: 'false'
          pr-queue: 'false'

      - name: Assert action ran with instructions-file input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          echo "input-tokens: $INPUT_TOKENS"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          # Metrics outputs should always be set (metrics-aggregate runs with if: always())
          if [ -z "$CACHE_HIT_RATIO" ]; then
            echo "FAIL: cache-hit-ratio output was not set"
            exit 1
          fi
          echo "PASS: metrics outputs are present"
