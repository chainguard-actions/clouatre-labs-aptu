name: Test fallback AI config is skipped when provider is empty
on:
  workflow_dispatch:
jobs:
  test-no-fallback-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          fallback-provider: ''
          fallback-model: ''
          dry-run: 'true'
          no-comment: 'true'

      - name: Assert fallback config file was NOT created
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          echo "Checking that config file does NOT exist at: $CONFIG_FILE"
          if [ -f "$CONFIG_FILE" ]; then
            echo "FAIL: config file should not exist when fallback-provider and fallback-model are empty"
            cat "$CONFIG_FILE"
            exit 1
          fi
          echo "PASS: config file correctly not created when fallback is disabled"
