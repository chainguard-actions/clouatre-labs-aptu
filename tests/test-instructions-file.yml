name: Test instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create instructions file fixture
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures"
          cat > "$GITHUB_WORKSPACE/hardened/tests/fixtures/pr-review-instructions.md" <<'EOF'
          # PR Review Instructions
          Focus on correctness, security, and maintainability.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          instructions-file: 'hardened/tests/fixtures/pr-review-instructions.md'
          dry-run: 'true'
          no-comment: 'true'
          skip-labeled: 'false'
          pr-queue: 'false'

      - name: Assert action ran (outputs set or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME); sentinel repo may cause failure which is expected"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          # Verify metrics outputs are always set (metrics-aggregate runs with always())
          if [ -z "$CACHE_HIT_RATIO" ]; then
            echo "FAIL: cache-hit-ratio output was not set"
            exit 1
          fi
          echo "PASS: all assertions passed"
