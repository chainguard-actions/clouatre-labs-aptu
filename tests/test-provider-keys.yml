name: Test provider API keys and instructions-file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create instructions file
        run: |
          mkdir -p "$RUNNER_TEMP/aptu-test"
          printf '# Review instructions\nBe concise.\n' > "$RUNNER_TEMP/aptu-test/instructions.md"
          rm -f "$HOME/.config/aptu/config.toml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: dummy-anthropic-key
          gemini-api-key: dummy-gemini-key
          openrouter-api-key: dummy-openrouter-key
          zai-api-key: dummy-zai-key
          provider: anthropic
          model: claude-test-model
          instructions-file: ${{ runner.temp }}/aptu-test/instructions.md
          fallback-provider: gemini
          fallback-model: gemini-test-model
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_OUTCOME: ${{ steps.action.outputs.pr-review-outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-review-outcome: '$PR_OUTCOME'"
          if [ "$OUTCOME" = "success" ]; then
            # Under workflow_dispatch the PR review step does not run
            if [ -n "$PR_OUTCOME" ]; then
              echo "FAIL: pr-review-outcome should be empty under workflow_dispatch"
              exit 1
            fi
            echo "PASS: action succeeded with provider keys set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (install/attestation not available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert fallback config uses provided fallback values
        run: |
          CONFIG="$HOME/.config/aptu/config.toml"
          if [ ! -f "$CONFIG" ]; then
            echo "FAIL: config file not written"
            exit 1
          fi
          cat "$CONFIG"
          if ! grep -q 'provider = "gemini"' "$CONFIG" || ! grep -q 'model = "gemini-test-model"' "$CONFIG"; then
            echo "FAIL: fallback config does not contain expected values"
            exit 1
          fi
          echo "PASS"

      - name: Assert API keys not leaked into config
        run: |
          CONFIG="$HOME/.config/aptu/config.toml"
          if grep -q 'dummy-' "$CONFIG"; then
            echo "FAIL: API key leaked into config file"
            exit 1
          fi
          echo "PASS"
