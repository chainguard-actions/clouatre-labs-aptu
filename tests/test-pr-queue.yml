name: Test pr-queue flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          pr-queue: 'true'

      - name: Assert action ran (pr-queue fires but sentinel repo or binary install may cause graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          if [ "$OUTCOME" = "success" ]; then
            # pr-queue succeeded - validate metric outputs are numeric
            if ! echo "$INPUT_TOKENS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: expected numeric input-tokens on success, got '$INPUT_TOKENS'"
              exit 1
            fi
            if ! echo "$OUTPUT_TOKENS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: expected numeric output-tokens on success, got '$OUTPUT_TOKENS'"
              exit 1
            fi
            echo "PASS: pr-queue succeeded with valid metric outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable for pr-queue, or binary install failed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
