name: Test security scan with scan-path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a sample file to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/scan-target"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/scan-target/sample.py" << 'EOF'
          # Sample Python file for security scanning test
          import os
          
          def get_user_data(user_id):
              # Simple function for testing
              return {"id": user_id, "name": "test"}
          EOF
          echo "Created sample scan target"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          scan-path: '${{ github.workspace }}/tests/fixtures/scan-target'
          dry-run: 'true'
          no-comment: 'true'
          fail-on: ''
          sarif-upload: 'false'
        continue-on-error: true

      - name: Assert action ran (scan step fired or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The scan step fires when scan-path is set.
          # It may fail if aptu binary install fails or API is unavailable,
          # but the action should not crash unexpectedly.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (scan completed)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo or API limits)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
