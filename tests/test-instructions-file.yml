name: Test instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a sample instructions file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/instructions"
          cat > "$GITHUB_WORKSPACE/.github/instructions/pr-review.md" <<'EOF'
          # PR Review Instructions
          Please review this PR for correctness and style.
          EOF

      - name: Run action with instructions-file input
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          instructions-file: '.github/instructions/pr-review.md'
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
        continue-on-error: true

      - name: Assert action completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch, the PR review step (which uses instructions-file) does not fire.
          # The action resolves/installs aptu and exits. Success or failure are both acceptable
          # (network/rate-limit may affect install step).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
