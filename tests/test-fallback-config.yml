name: Test fallback AI config is written
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake gh and aptu for testing
        run: |
          set -euo pipefail

          # Build a minimal fake aptu tarball that the fake gh will serve
          mkdir -p /tmp/fake-aptu-src /tmp/fake-aptu-release
          printf '#!/bin/sh\necho "fake aptu $*"\nexit 0\n' > /tmp/fake-aptu-src/aptu
          chmod +x /tmp/fake-aptu-src/aptu
          tar -czf /tmp/fake-aptu-release/fake.tar.gz -C /tmp/fake-aptu-src aptu

          # Install fake gh wrapper (uses fixture script)
          REAL_GH="$(command -v gh || echo /usr/bin/gh)"
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-gh.sh" "$HOME/.local/bin/gh"
          sed -i "s|REAL_GH_PATH:-/usr/bin/gh|REAL_GH_PATH:-$REAL_GH|g" "$HOME/.local/bin/gh"
          chmod +x "$HOME/.local/bin/gh"

          # Prepend our bin dir to PATH for this and subsequent steps
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          skip-labeled: 'false'

      - name: Assert fallback config file was written
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          echo "Checking for config file at: $CONFIG_FILE"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: config.toml was not created at $CONFIG_FILE"
            exit 1
          fi
          echo "Config file contents:"
          cat "$CONFIG_FILE"

          # Verify the config contains the expected fallback provider
          if ! grep -q 'openrouter' "$CONFIG_FILE"; then
            echo "FAIL: config.toml does not contain 'openrouter'"
            exit 1
          fi

          # Verify the config contains the expected fallback model
          if ! grep -q 'inception/mercury-2' "$CONFIG_FILE"; then
            echo "FAIL: config.toml does not contain 'inception/mercury-2'"
            exit 1
          fi

          # Verify the config has the expected TOML section
          if ! grep -q '\[ai.fallback\]' "$CONFIG_FILE"; then
            echo "FAIL: config.toml does not contain '[ai.fallback]' section"
            exit 1
          fi

          echo "PASS: fallback config written correctly"

      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          CACHE_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_RATIO"
          if [ -z "$INPUT_TOKENS" ]; then
            echo "FAIL: input-tokens output is empty"
            exit 1
          fi
          if [ -z "$CACHE_RATIO" ]; then
            echo "FAIL: cache-hit-ratio output is empty"
            exit 1
          fi
          echo "PASS: metrics outputs are set"
