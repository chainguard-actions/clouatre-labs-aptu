name: Test API key inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: 'sk-ant-test-placeholder'
          cerebras-api-key: 'csk-test-placeholder'
          gemini-api-key: 'AIza-test-placeholder'
          groq-api-key: 'gsk_test-placeholder'
          openrouter-api-key: 'sk-or-test-placeholder'
          zai-api-key: 'zai-test-placeholder'
          zenmux-api-key: 'zmx-test-placeholder'
          instructions-file: ''
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          skip-labeled: 'false'
          provider: ''
          model: ''

      - name: Assert action completed (setup steps ran, AI steps skipped under workflow_dispatch)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # Under workflow_dispatch, no AI steps run, so metrics default to 0/n/a
          # The action should succeed (setup steps complete, AI steps are skipped)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
            # Verify metrics outputs are present (even if zero)
            if [ -z "$INPUT_TOKENS" ] && [ -z "$OUTPUT_TOKENS" ] && [ -z "$DURATION_MS" ]; then
              echo "FAIL: all metric outputs are empty"
              exit 1
            fi
            echo "PASS: metric outputs are present"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected when sentinel repo or API limits apply)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
