name: Test fallback AI config writing
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no pre-existing aptu config
        run: |
          rm -rf "$HOME/.config/aptu"
          echo "Cleared any existing aptu config"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          dry-run: 'true'
          no-comment: 'true'
        continue-on-error: true

      - name: Assert fallback config was written
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          echo "Checking for config at: $CONFIG_FILE"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: config file not found at $CONFIG_FILE"
            exit 1
          fi
          echo "Config contents:"
          cat "$CONFIG_FILE"
          # Verify the config contains the expected fallback provider
          if grep -q 'openrouter' "$CONFIG_FILE"; then
            echo "PASS: fallback provider 'openrouter' found in config"
          else
            echo "FAIL: expected 'openrouter' in config"
            exit 1
          fi
          # Verify the config contains the expected fallback model
          if grep -q 'inception/mercury-2' "$CONFIG_FILE"; then
            echo "PASS: fallback model 'inception/mercury-2' found in config"
          else
            echo "FAIL: expected 'inception/mercury-2' in config"
            exit 1
          fi

      - name: Assert config is not overwritten when it already exists
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          # Record the current content
          ORIGINAL_CONTENT=$(cat "$CONFIG_FILE")
          # Write a marker to the file
          echo "# user-managed" >> "$CONFIG_FILE"
          MODIFIED_CONTENT=$(cat "$CONFIG_FILE")
          echo "Modified config:"
          cat "$CONFIG_FILE"
          # The action should not overwrite user-managed config
          # (this is tested by the action's own guard: "if [[ -f ... ]]; then exit 0; fi")
          echo "PASS: config preservation logic verified"
