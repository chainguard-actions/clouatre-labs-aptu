name: Test fallback AI config is written when fallback-provider is set
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The "Write fallback AI config" step runs before binary installation.
      # Even if binary installation fails (e.g. gh attestation verify in act),
      # the config file should already be written. Use continue-on-error so
      # assertion steps can still run.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          dry-run: 'true'

      - name: Assert fallback config file was written
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          echo "Checking for config at: $CONFIG_FILE"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: fallback config file not found at $CONFIG_FILE"
            exit 1
          fi
          echo "Config file contents:"
          cat "$CONFIG_FILE"
          echo "PASS: fallback config file exists"

      - name: Assert fallback config contains correct provider
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          if ! grep -q 'openrouter' "$CONFIG_FILE"; then
            echo "FAIL: config does not contain 'openrouter'"
            cat "$CONFIG_FILE"
            exit 1
          fi
          echo "PASS: config contains expected provider"

      - name: Assert fallback config contains correct model
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          if ! grep -q 'inception/mercury-2' "$CONFIG_FILE"; then
            echo "FAIL: config does not contain 'inception/mercury-2'"
            cat "$CONFIG_FILE"
            exit 1
          fi
          echo "PASS: config contains expected model"

      - name: Assert metrics outputs are present
        env:
          ACTUAL: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "cache-hit-ratio: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: cache-hit-ratio output is empty"
            exit 1
          fi
          echo "PASS: cache-hit-ratio=$ACTUAL"
