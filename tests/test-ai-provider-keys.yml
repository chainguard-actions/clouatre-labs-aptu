name: Test AI provider API key inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: "test-anthropic-key"
          cerebras-api-key: "test-cerebras-key"
          gemini-api-key: "test-gemini-key"
          groq-api-key: "test-groq-key"
          openrouter-api-key: "test-openrouter-key"
          zai-api-key: "test-zai-key"
          zenmux-api-key: "test-zenmux-key"
          dry-run: "true"
          no-comment: "true"
          skip-labeled: "false"

      - name: Assert action ran (metrics outputs set or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          if [ "$OUTCOME" = "success" ]; then
            # Metrics outputs should always be set (metrics-aggregate runs with if: always())
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: input-tokens output is empty on success"
              exit 1
            fi
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio output is empty on success"
              exit 1
            fi
            echo "PASS: action succeeded with AI provider key inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
