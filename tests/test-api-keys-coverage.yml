name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          # AI provider API keys (all covered in this test)
          anthropic-api-key: 'sk-ant-test-placeholder'
          cerebras-api-key: 'csk-test-placeholder'
          gemini-api-key: 'AIza-test-placeholder'
          groq-api-key: 'gsk_test-placeholder'
          openrouter-api-key: 'sk-or-test-placeholder'
          zai-api-key: 'zai-test-placeholder'
          zenmux-api-key: 'zmx-test-placeholder'
          # instructions-file coverage
          instructions-file: '.github/instructions/pr-review.md'
          # Use dry-run and no-comment to avoid side effects
          dry-run: 'true'
          no-comment: 'true'
          # Under workflow_dispatch, no AI steps fire, so metrics will be zero
          pr-queue: 'false'

      - name: Assert action completed (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          if [ "$OUTCOME" = "success" ]; then
            # Under workflow_dispatch, no AI steps fire; metrics should be zero/n/a
            echo "PASS: action succeeded"
            if [ -z "$INPUT_TOKENS" ] && [ -z "$OUTPUT_TOKENS" ] && [ -z "$DURATION_MS" ]; then
              echo "FAIL: all metric outputs are empty"
              exit 1
            fi
            echo "PASS: metric outputs are present"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo or missing real API keys)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
