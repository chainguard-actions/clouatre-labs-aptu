name: Test fallback AI config writing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When fallback-provider and fallback-model are set, the action writes
      # $HOME/.config/aptu/config.toml with the fallback chain config.
      # This step runs unconditionally (before the install steps).
      # The install steps may fail in act (gh attestation verify), so we
      # use continue-on-error and check the config file was written.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          dry-run: 'true'

      - name: Assert fallback config file was written
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          echo "Checking for config file at: $CONFIG_FILE"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: config.toml was not created at $CONFIG_FILE"
            exit 1
          fi
          echo "Config file contents:"
          cat "$CONFIG_FILE"
          # Verify it contains the fallback provider
          if ! grep -q 'openrouter' "$CONFIG_FILE"; then
            echo "FAIL: config.toml does not contain 'openrouter'"
            exit 1
          fi
          # Verify it contains the fallback model
          if ! grep -q 'inception/mercury-2' "$CONFIG_FILE"; then
            echo "FAIL: config.toml does not contain 'inception/mercury-2'"
            exit 1
          fi
          echo "PASS: fallback config written correctly"

      - name: Assert action outcome is acceptable
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed (outcome=$OUTCOME; install may fail in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
