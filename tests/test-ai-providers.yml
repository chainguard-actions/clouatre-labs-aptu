name: Test AI provider inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          # AI provider API keys (all providers covered)
          anthropic-api-key: 'test-anthropic-key'
          cerebras-api-key: 'test-cerebras-key'
          gemini-api-key: 'test-gemini-key'
          groq-api-key: 'test-groq-key'
          openrouter-api-key: 'test-openrouter-key'
          zai-api-key: 'test-zai-key'
          zenmux-api-key: 'test-zenmux-key'
          # PR review input
          instructions-file: '.github/instructions/pr-review.md'
          # Use dry-run to avoid side effects
          dry-run: 'true'
          # skip-labeled false so check-skip always proceeds
          skip-labeled: 'false'
          # Disable fallback to keep test simple
          fallback-provider: ''
          fallback-model: ''

      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # The action either succeeds (no aptu commands run for workflow_dispatch)
          # or fails gracefully (e.g. version resolution fails on sentinel repo).
          # In both cases, the metrics-aggregate step runs with if: always() and
          # should produce numeric outputs (defaulting to 0 when no usage file exists).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            # cache-hit-ratio should be either "n/a" or a percentage
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio output is empty"
              exit 1
            fi
            echo "PASS: action ran (outcome=$OUTCOME), metrics outputs present"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
