name: Test skip-labeled logic (no labels present, should not skip)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake gh CLI to bypass binary download and attestation
        run: |
          mkdir -p "$HOME/.local/fake-bin"

          cat > "$HOME/.local/fake-bin/gh" << 'GHSCRIPT'
          #!/bin/sh
          ARCH=$(uname -m)
          case "$ARCH" in
            aarch64|arm64) ARCH_NAME="aarch64" ;;
            *) ARCH_NAME="x86_64" ;;
          esac
          VERSION="0.8.3"
          ARCHIVE="aptu-cli-${VERSION}-${ARCH_NAME}-unknown-linux-musl.tar.gz"

          CMD="$1 $2"
          case "$CMD" in
            "api repos/clouatre-labs/aptu/releases")
              echo "v${VERSION}"
              exit 0
              ;;
            "release download")
              DIR=""
              PREV=""
              for arg in "$@"; do
                if [ "$PREV" = "-D" ]; then DIR="$arg"; fi
                PREV="$arg"
              done
              if [ -z "$DIR" ]; then
                echo "Error: -D flag not found" >&2
                exit 1
              fi
              printf '#!/bin/sh\necho "aptu fake v%s"\n' "$VERSION" > "$DIR/aptu"
              chmod +x "$DIR/aptu"
              tar -czf "$DIR/$ARCHIVE" -C "$DIR" aptu
              (cd "$DIR" && sha256sum "$ARCHIVE" > "${ARCHIVE%.tar.gz}.sha256")
              exit 0
              ;;
            "attestation verify")
              echo "Attestation verification skipped (test mode)"
              exit 0
              ;;
          esac

          if [ -x /usr/bin/gh ]; then
            exec /usr/bin/gh "$@"
          fi
          echo "gh: unhandled command: $*" >&2
          exit 1
          GHSCRIPT

          chmod +x "$HOME/.local/fake-bin/gh"
          echo "$HOME/.local/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          skip-labeled: 'true'
          dry-run: 'true'
          no-comment: 'true'

      - name: Assert metrics outputs are present (action ran, not skipped)
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          CACHE_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_RATIO"
          # All outputs should be set (not empty) since metrics-aggregate always runs
          if [ -z "$INPUT_TOKENS" ]; then
            echo "FAIL: input-tokens output is empty"
            exit 1
          fi
          if [ -z "$OUTPUT_TOKENS" ]; then
            echo "FAIL: output-tokens output is empty"
            exit 1
          fi
          if [ -z "$CACHE_RATIO" ]; then
            echo "FAIL: cache-hit-ratio output is empty"
            exit 1
          fi
          echo "PASS: all metric outputs are set"
