name: Test skip-labeled=true with no issue labels (should not skip)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          skip-labeled: 'true'
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          # Under workflow_dispatch, github.event.issue.labels is null/empty.
          # So HAS_TYPE=false and HAS_PRIORITY=false → skip=false.
          # The action proceeds to resolve/install aptu.
          # Under workflow_dispatch, no event-specific steps fire.
          # metrics-aggregate always runs (if: always()).

      - name: Assert action ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert metrics outputs when action succeeded
        if: steps.action.outcome == 'success'
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          ETU: ${{ steps.action.outputs.effective-token-units }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          echo "effective-token-units: $ETU"
          FAIL=0
          if [ -z "$INPUT_TOKENS" ]; then
            echo "FAIL: input-tokens is empty"
            FAIL=1
          fi
          if [ -z "$OUTPUT_TOKENS" ]; then
            echo "FAIL: output-tokens is empty"
            FAIL=1
          fi
          if [ -z "$DURATION_MS" ]; then
            echo "FAIL: duration-ms is empty"
            FAIL=1
          fi
          if [ -z "$CACHE_HIT_RATIO" ]; then
            echo "FAIL: cache-hit-ratio is empty"
            FAIL=1
          fi
          if [ -z "$ETU" ]; then
            echo "FAIL: effective-token-units is empty"
            FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then
            exit 1
          fi
          echo "PASS: all metrics outputs are populated"

      - name: Assert zero token usage when action succeeded
        if: steps.action.outcome == 'success'
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          if [ "$INPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected input-tokens=0, got '$INPUT_TOKENS'"
            exit 1
          fi
          if [ "$OUTPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected output-tokens=0, got '$OUTPUT_TOKENS'"
            exit 1
          fi
          echo "PASS: token usage is zero (no AI calls under workflow_dispatch)"

      - name: Assert cache-hit-ratio is n/a when action succeeded
        if: steps.action.outcome == 'success'
        env:
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          if [ "$CACHE_HIT_RATIO" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio=n/a when no tokens consumed, got '$CACHE_HIT_RATIO'"
            exit 1
          fi
          echo "PASS: cache-hit-ratio=n/a as expected"
