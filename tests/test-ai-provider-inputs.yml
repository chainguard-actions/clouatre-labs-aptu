name: Test AI provider inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: "test-anthropic-key"
          cerebras-api-key: "test-cerebras-key"
          gemini-api-key: "test-gemini-key"
          groq-api-key: "test-groq-key"
          openrouter-api-key: "test-openrouter-key"
          zai-api-key: "test-zai-key"
          zenmux-api-key: "test-zenmux-key"
          instructions-file: ".github/instructions/pr-review.md"
          dry-run: "true"
          no-comment: "true"
          apply-labels: "false"
          skip-labeled: "false"
          pr-queue: "false"

      - name: Assert action completed (metrics outputs set)
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # Under workflow_dispatch, no AI steps run, so metrics default to 0/n/a
          # The action should succeed (resolve-version may fail if API rate-limited,
          # but metrics-aggregate always runs and sets outputs)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or rate limit)"
          elif [ "$OUTCOME" = "success" ]; then
            # Metrics outputs should be set (0 when no AI calls made)
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio output not set"
              exit 1
            fi
            echo "PASS: action succeeded with all AI provider inputs accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
