name: Test skip-labeled behavior
on:
  workflow_dispatch:
jobs:
  test-skip-labeled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test skip logic with type and priority labels (should skip)
        run: |
          ISSUE_LABELS='[{"name":"type:bug"},{"name":"p1"},{"name":"enhancement"}]'
          HAS_TYPE=$(echo "$ISSUE_LABELS" | jq '(. // []) | [.[].name | select(startswith("type:"))] | length > 0')
          HAS_PRIORITY=$(echo "$ISSUE_LABELS" | jq '(. // []) | [.[].name | select(test("^p[0-9]$"))] | length > 0')
          echo "HAS_TYPE=$HAS_TYPE"
          echo "HAS_PRIORITY=$HAS_PRIORITY"
          if [[ "$HAS_TYPE" != "true" ]]; then
            echo "FAIL: expected HAS_TYPE=true for labels with type:bug"
            exit 1
          fi
          if [[ "$HAS_PRIORITY" != "true" ]]; then
            echo "FAIL: expected HAS_PRIORITY=true for labels with p1"
            exit 1
          fi
          echo "PASS: skip logic correctly identifies issue with type and priority labels"

      - name: Test skip logic with only type label (should NOT skip)
        run: |
          ISSUE_LABELS='[{"name":"type:bug"},{"name":"enhancement"}]'
          HAS_TYPE=$(echo "$ISSUE_LABELS" | jq '(. // []) | [.[].name | select(startswith("type:"))] | length > 0')
          HAS_PRIORITY=$(echo "$ISSUE_LABELS" | jq '(. // []) | [.[].name | select(test("^p[0-9]$"))] | length > 0')
          echo "HAS_TYPE=$HAS_TYPE"
          echo "HAS_PRIORITY=$HAS_PRIORITY"
          if [[ "$HAS_TYPE" != "true" ]]; then
            echo "FAIL: expected HAS_TYPE=true"
            exit 1
          fi
          if [[ "$HAS_PRIORITY" != "false" ]]; then
            echo "FAIL: expected HAS_PRIORITY=false when no priority label present"
            exit 1
          fi
          echo "PASS: skip logic correctly does NOT skip when only type label present"

      - name: Test skip logic with no labels (should NOT skip)
        run: |
          ISSUE_LABELS='[]'
          HAS_TYPE=$(echo "$ISSUE_LABELS" | jq '(. // []) | [.[].name | select(startswith("type:"))] | length > 0')
          HAS_PRIORITY=$(echo "$ISSUE_LABELS" | jq '(. // []) | [.[].name | select(test("^p[0-9]$"))] | length > 0')
          echo "HAS_TYPE=$HAS_TYPE"
          echo "HAS_PRIORITY=$HAS_PRIORITY"
          if [[ "$HAS_TYPE" != "false" ]]; then
            echo "FAIL: expected HAS_TYPE=false for empty labels"
            exit 1
          fi
          if [[ "$HAS_PRIORITY" != "false" ]]; then
            echo "FAIL: expected HAS_PRIORITY=false for empty labels"
            exit 1
          fi
          echo "PASS: skip logic correctly does NOT skip when no labels present"

      - name: Test skip logic with null labels (should NOT skip)
        run: |
          ISSUE_LABELS='null'
          HAS_TYPE=$(echo "$ISSUE_LABELS" | jq '(. // []) | [.[].name | select(startswith("type:"))] | length > 0')
          HAS_PRIORITY=$(echo "$ISSUE_LABELS" | jq '(. // []) | [.[].name | select(test("^p[0-9]$"))] | length > 0')
          echo "HAS_TYPE=$HAS_TYPE"
          echo "HAS_PRIORITY=$HAS_PRIORITY"
          if [[ "$HAS_TYPE" != "false" ]]; then
            echo "FAIL: expected HAS_TYPE=false for null labels"
            exit 1
          fi
          if [[ "$HAS_PRIORITY" != "false" ]]; then
            echo "FAIL: expected HAS_PRIORITY=false for null labels"
            exit 1
          fi
          echo "PASS: skip logic correctly handles null labels"

      # Run the action in workflow_dispatch context (no AI steps fire, no issue labels)
      # The action will attempt to resolve the aptu version but may fail in act environment
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          skip-labeled: 'true'
          dry-run: 'true'

      - name: Assert action step ran (skip=false in workflow_dispatch context)
        env:
          ACTION_OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $ACTION_OUTCOME"
          # In workflow_dispatch context, issue labels are empty so skip=false
          # The action proceeds to resolve-version which may fail in act
          # We just verify the action step ran (not skipped entirely)
          if [ "$ACTION_OUTCOME" = "" ]; then
            echo "FAIL: action step did not run"
            exit 1
          fi
          echo "PASS: action step ran with outcome=$ACTION_OUTCOME"
