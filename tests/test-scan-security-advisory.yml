name: Test scan-security advisory mode is non-blocking
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install gh CLI (not present in the act runner image)
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then gh --version; exit 0; fi
          GH_VERSION=2.63.2
          case "$(uname -m)" in
            aarch64|arm64) GH_ARCH=arm64 ;;
            *) GH_ARCH=amd64 ;;
          esac
          DEST="$HOME/.gh-cli"
          mkdir -p "$DEST"
          curl -sSfL -o /tmp/gh.tar.gz "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${GH_ARCH}.tar.gz"
          tar -xzf /tmp/gh.tar.gz -C "$DEST" --strip-components=1
          "$DEST/bin/gh" --version
          echo "$DEST/bin" >> "$GITHUB_PATH"
      - name: Create a small directory to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-target"
          printf 'import os\nprint(os.environ.get("HOME"))\n' > "$GITHUB_WORKSPACE/scan-target/app.py"
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'
          scan-path: scan-target
          sarif-upload: 'false'
      - name: Assert action succeeded (scan is advisory when fail-on is empty)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: advisory scan must not fail the action"; exit 1
          fi
          if ! command -v aptu >/dev/null 2>&1; then
            echo "FAIL: aptu not on PATH"; exit 1
          fi
          echo "PASS"
