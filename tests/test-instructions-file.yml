name: Test instructions-file input accepted (PR review not triggered under workflow_dispatch)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create instructions file
        run: |
          mkdir -p "$RUNNER_TEMP/instr"
          echo "Review for correctness." > "$RUNNER_TEMP/instr/pr-review.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          instructions-file: ${{ runner.temp }}/instr/pr-review.md
          skip-labeled: 'false'
          dry-run: 'true'
          no-comment: 'true'

      - name: Assert action ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert PR review did not run and metrics are zero
        if: steps.action.outcome == 'success'
        env:
          PR_REVIEW_OUTCOME: ${{ steps.action.outputs.pr-review-outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
        run: |
          echo "pr-review-outcome: $PR_REVIEW_OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          if [ -n "$PR_REVIEW_OUTCOME" ]; then
            echo "FAIL: pr-review should not run under workflow_dispatch"
            exit 1
          fi
          if [ "$INPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected input-tokens=0"
            exit 1
          fi
          echo "PASS"
