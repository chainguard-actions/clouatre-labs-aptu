name: Test basic metrics outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup fake gh and aptu for act environment
        run: |
          set -euo pipefail

          # Save the real gh path before we shadow it
          REAL_GH=$(which gh 2>/dev/null || echo "/usr/bin/gh")
          echo "$REAL_GH" > /tmp/real-gh-path

          # Determine architecture
          ARCH_RAW=$(uname -m)
          case "$ARCH_RAW" in
            aarch64|arm64) ARCH="aarch64" ;;
            x86_64)        ARCH="x86_64"  ;;
            *)             ARCH="x86_64"  ;;
          esac

          FAKE_VERSION="0.99.99"
          ARCHIVE="aptu-cli-${FAKE_VERSION}-${ARCH}-unknown-linux-musl.tar.gz"
          SHA256_FILE="aptu-cli-${FAKE_VERSION}-${ARCH}-unknown-linux-musl.sha256"

          # Pre-create fake release files
          mkdir -p /tmp/fake-release

          # Create a minimal fake aptu binary
          printf '#!/bin/sh\necho "fake aptu: $*"\nexit 0\n' > /tmp/fake-release/aptu
          chmod +x /tmp/fake-release/aptu

          # Create the tar.gz archive containing the fake aptu binary
          tar -czf "/tmp/fake-release/${ARCHIVE}" -C /tmp/fake-release aptu

          # Create matching sha256 file (format: hash  filename)
          SHA256=$(sha256sum "/tmp/fake-release/${ARCHIVE}" | awk '{print $1}')
          printf '%s  %s\n' "$SHA256" "$ARCHIVE" > "/tmp/fake-release/${SHA256_FILE}"

          # Write the fake gh wrapper
          cat > /tmp/fake-gh << 'GH_EOF'
          #!/bin/sh
          ARGS="$*"
          case "$ARGS" in
            *"attestation verify"*)
              echo "Verified provenance (mocked)"
              exit 0
              ;;
            *"repos/clouatre-labs/aptu/releases"*)
              # Return the fake version tag; action pipes through: sed 's/^v//'
              echo "v0.99.99"
              exit 0
              ;;
            *"release download"*)
              # Parse -D flag for destination directory
              DEST=""
              prev=""
              for arg in "$@"; do
                if [ "$prev" = "-D" ]; then
                  DEST="$arg"
                fi
                prev="$arg"
              done
              if [ -n "$DEST" ]; then
                cp /tmp/fake-release/* "$DEST/"
              fi
              exit 0
              ;;
            *)
              REAL_GH=$(cat /tmp/real-gh-path 2>/dev/null || echo "/usr/bin/gh")
              exec "$REAL_GH" "$@"
              ;;
          esac
          GH_EOF
          chmod +x /tmp/fake-gh

          # Put fake gh at front of PATH
          mkdir -p /tmp/fake-bin
          ln -sf /tmp/fake-gh /tmp/fake-bin/gh
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          skip-labeled: 'false'

      - name: Assert input-tokens output is numeric
        env:
          ACTUAL: ${{ steps.action.outputs.input-tokens }}
        run: |
          echo "actual input-tokens: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected numeric input-tokens, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: input-tokens=$ACTUAL"

      - name: Assert output-tokens output is numeric
        env:
          ACTUAL: ${{ steps.action.outputs.output-tokens }}
        run: |
          echo "actual output-tokens: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected numeric output-tokens, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: output-tokens=$ACTUAL"

      - name: Assert duration-ms output is numeric
        env:
          ACTUAL: ${{ steps.action.outputs.duration-ms }}
        run: |
          echo "actual duration-ms: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected numeric duration-ms, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: duration-ms=$ACTUAL"

      - name: Assert cache-hit-ratio is n/a when no AI calls made
        env:
          ACTUAL: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "actual cache-hit-ratio: $ACTUAL"
          if [ "$ACTUAL" != "n/a" ]; then
            echo "FAIL: expected 'n/a' for cache-hit-ratio when no AI calls made, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: cache-hit-ratio=n/a"

      - name: Assert effective-token-units is numeric
        env:
          ACTUAL: ${{ steps.action.outputs.effective-token-units }}
        run: |
          echo "actual effective-token-units: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected numeric effective-token-units, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: effective-token-units=$ACTUAL"
