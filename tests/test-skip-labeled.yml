name: Test skip-labeled logic (no labels present)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          # skip-labeled=true but no issue labels present (workflow_dispatch has no issue context)
          # so the action should NOT skip — skip=false
          skip-labeled: 'true'
          dry-run: 'true'

      - name: Assert action ran (not skipped) and completed or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # The action should not have been skipped (skip=false because no labels present).
          # It will attempt binary installation. If it succeeds, metrics are 0/n/a (no AI calls).
          # If it fails (e.g. gh attestation verify not supported), that's also acceptable.
          if [ "$OUTCOME" = "success" ]; then
            # Metrics aggregate step always runs; no AI calls → input_tokens=0, cache_hit_ratio=n/a
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: input-tokens output is empty — metrics-aggregate step did not run"
              exit 1
            fi
            if [ "$INPUT_TOKENS" != "0" ]; then
              echo "FAIL: expected input-tokens=0 (no AI calls), got '$INPUT_TOKENS'"
              exit 1
            fi
            if [ "$CACHE_HIT_RATIO" != "n/a" ]; then
              echo "FAIL: expected cache-hit-ratio=n/a (no AI calls), got '$CACHE_HIT_RATIO'"
              exit 1
            fi
            echo "PASS: action ran (not skipped), metrics are zero as expected"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (binary install may not be supported in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
