name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          # AI provider API keys (all optional — just need to be passed as inputs)
          anthropic-api-key: 'sk-ant-test-placeholder'
          cerebras-api-key: 'csk-test-placeholder'
          gemini-api-key: 'AIza-test-placeholder'
          groq-api-key: 'gsk_test-placeholder'
          openrouter-api-key: 'sk-or-test-placeholder'
          zai-api-key: 'zai-test-placeholder'
          zenmux-api-key: 'zmx-test-placeholder'
          # instructions-file coverage
          instructions-file: '.github/instructions/pr-review.md'
          # Behavior flags
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          skip-labeled: 'false'
          # pr-queue disabled so no AI call fires
          pr-queue: 'false'

      - name: Assert action ran and produced metrics outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          if [ "$OUTCOME" = "success" ]; then
            # Metrics outputs should be present (0 is valid when no AI calls fired)
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: input-tokens output is empty"
              exit 1
            fi
            if [ -z "$OUTPUT_TOKENS" ]; then
              echo "FAIL: output-tokens output is empty"
              exit 1
            fi
            if [ -z "$DURATION_MS" ]; then
              echo "FAIL: duration-ms output is empty"
              exit 1
            fi
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with all API key inputs and instructions-file"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo / no real AI keys)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
