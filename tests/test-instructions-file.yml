name: Test instructions-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy instructions file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/instructions"
          echo "# PR Review Instructions" > "$GITHUB_WORKSPACE/.github/instructions/pr-review.md"
          echo "Review all PRs carefully." >> "$GITHUB_WORKSPACE/.github/instructions/pr-review.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          instructions-file: '.github/instructions/pr-review.md'
          dry-run: 'true'
          no-comment: 'true'
          skip-labeled: 'false'

      - name: Assert metrics outputs are present (action ran through metrics-aggregate)
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # The metrics-aggregate step always runs (if: always()), so outputs must be set
          if [ -z "$INPUT_TOKENS" ]; then
            echo "FAIL: input-tokens output is empty"
            exit 1
          fi
          if [ -z "$OUTPUT_TOKENS" ]; then
            echo "FAIL: output-tokens output is empty"
            exit 1
          fi
          if [ -z "$DURATION_MS" ]; then
            echo "FAIL: duration-ms output is empty"
            exit 1
          fi
          if [ -z "$CACHE_HIT_RATIO" ]; then
            echo "FAIL: cache-hit-ratio output is empty"
            exit 1
          fi
          echo "PASS: all metrics outputs are present and instructions-file input was accepted"
