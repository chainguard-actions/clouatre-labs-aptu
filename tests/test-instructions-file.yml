name: Test instructions-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy instructions file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/instructions"
          cat > "$GITHUB_WORKSPACE/.github/instructions/pr-review.md" <<'EOF'
          # PR Review Instructions
          Please review the PR for correctness and style.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          instructions-file: ".github/instructions/pr-review.md"
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'

      - name: Assert action ran and metrics outputs are set
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            # Metrics outputs should always be set (even if 0 / n/a) because
            # the metrics-aggregate step runs with if: always()
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio output was not set"
              exit 1
            fi
            echo "PASS: action ran with instructions-file input and metrics outputs are present"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
