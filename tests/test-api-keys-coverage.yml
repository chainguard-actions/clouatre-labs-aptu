name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: "dummy-anthropic-key"
          cerebras-api-key: "dummy-cerebras-key"
          gemini-api-key: "dummy-gemini-key"
          groq-api-key: "dummy-groq-key"
          openrouter-api-key: "dummy-openrouter-key"
          zai-api-key: "dummy-zai-key"
          zenmux-api-key: "dummy-zenmux-key"
          instructions-file: ".github/instructions/pr-review.md"
          dry-run: "true"
          no-comment: "true"
          apply-labels: "false"
          skip-labeled: "false"
          pr-queue: "false"

      - name: Assert action ran (check-skip and metrics steps always run)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          if [ "$OUTCOME" = "success" ]; then
            # Metrics outputs should be set (even if zero)
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: action succeeded but input-tokens output is empty"
              exit 1
            fi
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: action succeeded but cache-hit-ratio output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with all API key inputs accepted"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API resolution issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
