name: Test pr-queue flag triggers queue step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock gh CLI and fake aptu binary
        run: |
          set -euo pipefail
          APTU_VERSION="0.99.0"
          ARCH="x86_64"
          ARCHIVE="aptu-cli-${APTU_VERSION}-${ARCH}-unknown-linux-musl.tar.gz"

          # Build fake aptu tarball that the mock gh will serve
          mkdir -p /tmp/aptu-mock/pkg
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-aptu.sh" /tmp/aptu-mock/pkg/aptu
          chmod +x /tmp/aptu-mock/pkg/aptu
          tar -czf "/tmp/aptu-mock/${ARCHIVE}" -C /tmp/aptu-mock/pkg aptu
          cd /tmp/aptu-mock
          sha256sum "${ARCHIVE}" > "${ARCHIVE%.tar.gz}.sha256"

          # Install mock gh so it intercepts all gh calls from the action
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-gh.sh" /usr/local/bin/gh
          chmod +x /usr/local/bin/gh

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          # Enable pr-queue — the step has continue-on-error: true so it won't
          # fail the action even if no AI key is provided
          pr-queue: 'true'
          dry-run: 'true'

      - name: Assert action completed with metrics outputs
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          ETU: ${{ steps.action.outputs.effective-token-units }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_RATIO"
          echo "effective-token-units: $ETU"
          # All outputs must be present
          if [ -z "$INPUT_TOKENS" ]; then
            echo "FAIL: input-tokens output missing"
            exit 1
          fi
          if [ -z "$OUTPUT_TOKENS" ]; then
            echo "FAIL: output-tokens output missing"
            exit 1
          fi
          if [ -z "$DURATION_MS" ]; then
            echo "FAIL: duration-ms output missing"
            exit 1
          fi
          if [ -z "$CACHE_RATIO" ]; then
            echo "FAIL: cache-hit-ratio output missing"
            exit 1
          fi
          if [ -z "$ETU" ]; then
            echo "FAIL: effective-token-units output missing"
            exit 1
          fi
          echo "PASS: all outputs present after pr-queue run"
