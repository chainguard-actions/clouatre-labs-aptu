name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: 'sk-ant-test-placeholder'
          cerebras-api-key: 'csk-test-placeholder'
          gemini-api-key: 'AIza-test-placeholder'
          groq-api-key: 'gsk_test-placeholder'
          openrouter-api-key: 'sk-or-test-placeholder'
          zai-api-key: 'zai-test-placeholder'
          zenmux-api-key: 'zmx-test-placeholder'
          instructions-file: '.github/instructions/pr-review.md'
          dry-run: 'true'
          no-comment: 'true'
          pr-queue: 'false'

      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # Under workflow_dispatch no AI steps fire, so metrics should be zero/n/a
          if [ "$INPUT_TOKENS" != "0" ] && [ -n "$INPUT_TOKENS" ]; then
            echo "WARN: expected input-tokens=0 but got '$INPUT_TOKENS'"
          fi
          if [ "$OUTPUT_TOKENS" != "0" ] && [ -n "$OUTPUT_TOKENS" ]; then
            echo "WARN: expected output-tokens=0 but got '$OUTPUT_TOKENS'"
          fi
          if [ "$DURATION_MS" != "0" ] && [ -n "$DURATION_MS" ]; then
            echo "WARN: expected duration-ms=0 but got '$DURATION_MS'"
          fi
          if [ "$CACHE_HIT_RATIO" != "n/a" ] && [ -n "$CACHE_HIT_RATIO" ]; then
            echo "WARN: expected cache-hit-ratio=n/a but got '$CACHE_HIT_RATIO'"
          fi

          echo "PASS: all API key inputs accepted and metrics outputs are present"
