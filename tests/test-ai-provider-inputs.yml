name: Test AI provider inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          # AI provider API keys — all passed to satisfy input coverage
          anthropic-api-key: 'placeholder-anthropic-key'
          cerebras-api-key: 'placeholder-cerebras-key'
          gemini-api-key: 'placeholder-gemini-key'
          groq-api-key: 'placeholder-groq-key'
          openrouter-api-key: 'placeholder-openrouter-key'
          zai-api-key: 'placeholder-zai-key'
          zenmux-api-key: 'placeholder-zenmux-key'
          # PR review config — instructions-file coverage
          instructions-file: 'AGENTS.md'
          # Behavior flags — keep non-destructive
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          # No scan-path, no pr-queue — only metrics-aggregate fires
          scan-path: ''
          pr-queue: 'false'

      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # The action either succeeds (installs aptu, no triage/review steps fire on
          # workflow_dispatch) or fails gracefully (sentinel repo / API issues).
          # In both cases the metrics-aggregate step runs (if: always()) and emits outputs.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            # cache-hit-ratio must be set (either "n/a" or a percentage)
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio output is empty"
              exit 1
            fi
            echo "PASS: action ran and metrics outputs are present (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
