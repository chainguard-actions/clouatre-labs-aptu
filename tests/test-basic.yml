name: Test basic usage (workflow_dispatch, no AI calls)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # On workflow_dispatch, the action installs the aptu binary (real download +
      # gh attestation verify) but runs no AI commands. The binary installation
      # may fail under act if gh attestation verify is unsupported in the runner
      # environment. We accept either outcome: success (binary installed, 0 tokens)
      # or failure (installation failed gracefully). In both cases, the composite
      # action's metrics-aggregate step runs with if: always() and sets outputs.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'

      - name: Assert action ran and metric outputs are set
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          ETU: ${{ steps.action.outputs.effective-token-units }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          echo "effective-token-units: $ETU"

          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded: verify metric outputs are set and zero (no AI calls on workflow_dispatch)
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: input-tokens output is empty"
              exit 1
            fi
            if [ -z "$OUTPUT_TOKENS" ]; then
              echo "FAIL: output-tokens output is empty"
              exit 1
            fi
            if [ -z "$DURATION_MS" ]; then
              echo "FAIL: duration-ms output is empty"
              exit 1
            fi
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio output is empty"
              exit 1
            fi
            if [ "$INPUT_TOKENS" != "0" ]; then
              echo "FAIL: expected 0 input tokens for workflow_dispatch with no AI calls, got $INPUT_TOKENS"
              exit 1
            fi
            if [ "$OUTPUT_TOKENS" != "0" ]; then
              echo "FAIL: expected 0 output tokens for workflow_dispatch with no AI calls, got $OUTPUT_TOKENS"
              exit 1
            fi
            echo "PASS: action succeeded, 0 tokens consumed as expected"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (binary installation may not be supported under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
