name: Test pr-queue flag (sentinel repo causes graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake gh wrapper to mock aptu binary installation
        run: |
          mkdir -p /tmp/fake-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-gh.sh" /tmp/fake-bin/gh
          chmod +x /tmp/fake-bin/gh
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      # pr-queue=true triggers the "Run aptu pr queue" step.
      # GITHUB_REPOSITORY is a sentinel (not a real repo), so aptu pr queue will fail,
      # but the step has continue-on-error: true so the action should still succeed overall.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          pr-queue: 'true'
          dry-run: 'true'

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — metrics outputs should be present
            if ! echo "$INPUT_TOKENS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: action succeeded but input-tokens is not numeric: '$INPUT_TOKENS'"
              exit 1
            fi
            if [ "$CACHE_HIT_RATIO" != "n/a" ]; then
              echo "FAIL: expected cache-hit-ratio=n/a (no AI calls), got '$CACHE_HIT_RATIO'"
              exit 1
            fi
            echo "PASS: action succeeded with valid metric outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable, or infrastructure issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
