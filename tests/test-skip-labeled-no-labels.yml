name: Test skip-labeled with no labels (should not skip)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock gh binary
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"

          cat > "$HOME/.local/bin/gh" << 'GHEOF'
          #!/bin/sh
          case "$*" in
            *"repos/clouatre-labs/aptu/releases"*)
              echo "0.10.6"
              exit 0
              ;;
            *"release download"*)
              DIR=""
              prev=""
              for arg in "$@"; do
                if [ "$prev" = "-D" ]; then DIR="$arg"; fi
                prev="$arg"
              done
              if [ -z "$DIR" ]; then
                echo "gh mock: missing -D argument" >&2; exit 1
              fi
              case "$(uname -m)" in
                aarch64|arm64) ARCH="aarch64" ;;
                *) ARCH="x86_64" ;;
              esac
              ARCHIVE="aptu-cli-0.10.6-${ARCH}-unknown-linux-musl.tar.gz"
              SHA_FILE="aptu-cli-0.10.6-${ARCH}-unknown-linux-musl.sha256"
              FAKE_DIR=$(mktemp -d)
              printf '#!/bin/sh\necho "fake aptu $*"\nexit 0\n' > "$FAKE_DIR/aptu"
              chmod +x "$FAKE_DIR/aptu"
              tar -czf "$DIR/$ARCHIVE" -C "$FAKE_DIR" aptu
              rm -rf "$FAKE_DIR"
              (cd "$DIR" && sha256sum "$ARCHIVE" > "$SHA_FILE")
              exit 0
              ;;
            *"attestation verify"*)
              echo "Attestation verified (mock)"
              exit 0
              ;;
            *)
              if [ -x /usr/bin/gh ]; then exec /usr/bin/gh "$@"; fi
              echo "gh mock: unhandled: $*" >&2; exit 1
              ;;
          esac
          GHEOF
          chmod +x "$HOME/.local/bin/gh"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Under workflow_dispatch, github.event.issue.labels is empty/null.
      # With skip-labeled=true and no labels, check-skip should output skip=false.
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          skip-labeled: 'true'
          dry-run: 'true'
          no-comment: 'true'

      # The action should complete successfully with zero metrics
      - name: Assert metrics outputs are zero (action ran, no AI calls fired)
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_RATIO"

          if [ "$INPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected input-tokens=0, got '$INPUT_TOKENS'"
            exit 1
          fi
          if [ "$OUTPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected output-tokens=0, got '$OUTPUT_TOKENS'"
            exit 1
          fi
          if [ "$DURATION_MS" != "0" ]; then
            echo "FAIL: expected duration-ms=0, got '$DURATION_MS'"
            exit 1
          fi
          if [ "$CACHE_RATIO" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio=n/a, got '$CACHE_RATIO'"
            exit 1
          fi
          echo "PASS: all metrics are zero/n/a as expected"
