name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          # AI provider API keys (all covered in this test)
          anthropic-api-key: dummy-anthropic-key
          cerebras-api-key: dummy-cerebras-key
          gemini-api-key: dummy-gemini-key
          groq-api-key: dummy-groq-key
          openrouter-api-key: dummy-openrouter-key
          zai-api-key: dummy-zai-key
          zenmux-api-key: dummy-zenmux-key
          # instructions-file input coverage
          instructions-file: ''
          # Use dry-run and no-comment to avoid side effects
          dry-run: 'true'
          no-comment: 'true'
          # Disable pr-queue to avoid unnecessary API calls
          pr-queue: 'false'
          # Fallback config
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'

      - name: Assert action ran (setup steps completed or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          if [ "$OUTCOME" = "success" ]; then
            # Under workflow_dispatch no AI steps fire, so tokens should be 0
            echo "PASS: action succeeded (no AI steps fire under workflow_dispatch)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or install issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
