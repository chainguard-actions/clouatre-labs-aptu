name: Test AI provider inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy instructions file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures"
          echo "# PR Review Instructions" > "$GITHUB_WORKSPACE/hardened/tests/fixtures/pr-review.md"
          echo "Review all changes carefully." >> "$GITHUB_WORKSPACE/hardened/tests/fixtures/pr-review.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: "dummy-anthropic-key"
          cerebras-api-key: "dummy-cerebras-key"
          gemini-api-key: "dummy-gemini-key"
          groq-api-key: "dummy-groq-key"
          openrouter-api-key: "dummy-openrouter-key"
          zai-api-key: "dummy-zai-key"
          zenmux-api-key: "dummy-zenmux-key"
          instructions-file: "${{ github.workspace }}/hardened/tests/fixtures/pr-review.md"
          provider: "openrouter"
          model: "mistralai/mistral-small-2603"
          fallback-provider: "openrouter"
          fallback-model: "inception/mercury-2"
          dry-run: "true"
          no-comment: "true"
          apply-labels: "false"
          skip-labeled: "false"

      - name: Assert action ran (no event-specific steps fire under workflow_dispatch)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          if [ "$OUTCOME" = "success" ]; then
            # Under workflow_dispatch no AI calls are made, so tokens should be 0
            echo "PASS: action succeeded"
            if [ -n "$CACHE_HIT_RATIO" ]; then
              echo "PASS: cache-hit-ratio output is set: $CACHE_HIT_RATIO"
            else
              echo "FAIL: cache-hit-ratio output is empty"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected if aptu install or API call failed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
