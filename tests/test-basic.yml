name: Test basic usage (workflow_dispatch, metrics outputs)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under workflow_dispatch with no issue/PR context, the action:
      # 1. Checks skip-labeled (skip=false, no labels)
      # 2. Resolves aptu version via gh api (real token, real repo)
      # 3. Installs aptu binary (may fail if gh attestation verify fails in act)
      # 4. Runs metrics-aggregate with if: always() -> outputs zeros
      # The action may fail at the install step due to SLSA attestation in act env.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'

      - name: Assert action ran and metrics outputs are set or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          ETU: ${{ steps.action.outputs.effective-token-units }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          echo "effective-token-units: $ETU"

          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded: all metric outputs must be set (metrics-aggregate runs with if: always())
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: action succeeded but input-tokens output is empty"
              exit 1
            fi
            if [ -z "$OUTPUT_TOKENS" ]; then
              echo "FAIL: action succeeded but output-tokens output is empty"
              exit 1
            fi
            if [ -z "$DURATION_MS" ]; then
              echo "FAIL: action succeeded but duration-ms output is empty"
              exit 1
            fi
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: action succeeded but cache-hit-ratio output is empty"
              exit 1
            fi
            if [ -z "$ETU" ]; then
              echo "FAIL: action succeeded but effective-token-units output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with all metric outputs set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (binary install/attestation may not work in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
