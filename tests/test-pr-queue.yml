name: Test pr-queue mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          pr-queue: 'true'
          dry-run: 'true'
          # pr-queue=true triggers 'aptu pr queue --repo $REPO'
          # The step has continue-on-error: true so it won't fail the workflow
          # even if the sentinel GITHUB_REPOSITORY is not resolvable.

      - name: Assert action completed (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          ETU: ${{ steps.action.outputs.effective-token-units }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          echo "effective-token-units: $ETU"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: input-tokens output is empty"
              exit 1
            fi
            if [ -z "$OUTPUT_TOKENS" ]; then
              echo "FAIL: output-tokens output is empty"
              exit 1
            fi
            if [ -z "$DURATION_MS" ]; then
              echo "FAIL: duration-ms output is empty"
              exit 1
            fi
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio output is empty"
              exit 1
            fi
            if [ -z "$ETU" ]; then
              echo "FAIL: effective-token-units output is empty"
              exit 1
            fi
            echo "PASS: all metrics outputs are set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (binary install or sentinel repo may not be resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert aptu binary is installed (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v aptu > /dev/null 2>&1; then
              echo "FAIL: aptu binary not found on PATH after successful action"
              exit 1
            fi
            echo "PASS: aptu is installed at $(command -v aptu)"
          else
            echo "PASS: skipping binary check since action did not succeed"
          fi
