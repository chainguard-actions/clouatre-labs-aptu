name: Test fallback AI config is written
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When fallback-provider and fallback-model are set, the action writes
      # $HOME/.config/aptu/config.toml with the fallback chain configuration.
      # The config is written before the binary install step, so it is present
      # even if the install fails under act. continue-on-error: true lets us
      # assert on the config file and metrics outputs regardless.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          dry-run: 'true'
          skip-labeled: 'false'

      - name: Assert fallback config file was written
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          echo "Checking for config file at: $CONFIG_FILE"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: config file not found at $CONFIG_FILE"
            exit 1
          fi
          echo "Config file contents:"
          cat "$CONFIG_FILE"
          echo "PASS: config file exists"

      - name: Assert fallback config contains expected provider
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          if ! grep -q 'openrouter' "$CONFIG_FILE"; then
            echo "FAIL: config file does not contain 'openrouter'"
            cat "$CONFIG_FILE"
            exit 1
          fi
          if ! grep -q 'inception/mercury-2' "$CONFIG_FILE"; then
            echo "FAIL: config file does not contain 'inception/mercury-2'"
            cat "$CONFIG_FILE"
            exit 1
          fi
          echo "PASS: config file contains expected provider and model"

      - name: Assert metrics outputs are zero (no AI calls made)
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          CACHE_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_RATIO"
          if [ "$INPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected input-tokens=0, got '$INPUT_TOKENS'"
            exit 1
          fi
          if [ "$CACHE_RATIO" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio=n/a, got '$CACHE_RATIO'"
            exit 1
          fi
          echo "PASS"
