name: Test basic metrics output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under workflow_dispatch, no issue/PR/scan steps fire.
      # The action resolves + installs the aptu binary, then metrics-aggregate
      # always runs (if: always()) and populates all metrics outputs.
      # continue-on-error: true handles the case where binary installation
      # fails in the act environment (e.g. gh attestation verify).
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'

      - name: Assert metrics outputs or graceful failure
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          ETU: ${{ steps.action.outputs.effective-token-units }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          echo "effective-token-units: $ETU"

          if [ "$OUTCOME" = "success" ]; then
            # All metrics outputs must be set when action succeeds
            for var_name in INPUT_TOKENS OUTPUT_TOKENS DURATION_MS CACHE_HIT_RATIO ETU; do
              eval "val=\$$var_name"
              if [ -z "$val" ]; then
                echo "FAIL: $var_name output is empty on success"
                exit 1
              fi
            done
            # When no AI calls are made, cache-hit-ratio should be "n/a"
            if [ "$CACHE_HIT_RATIO" != "n/a" ]; then
              echo "FAIL: expected cache-hit-ratio='n/a' but got '$CACHE_HIT_RATIO'"
              exit 1
            fi
            echo "PASS: all metrics outputs set correctly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (binary installation may not be supported in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
