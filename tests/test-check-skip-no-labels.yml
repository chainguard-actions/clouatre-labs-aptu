name: Test check-skip outputs skip=false when no issue labels
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          # skip-labeled defaults to 'true' but no issue labels exist under workflow_dispatch
          # so check-skip should output skip=false and the action proceeds to install aptu
          dry-run: 'true'
        continue-on-error: true

      - name: Assert action did not crash unexpectedly
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed (aptu installed) or fail (API rate limit / attestation),
          # but it must NOT be skipped. A skipped step means the workflow itself is broken.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped — workflow configuration error"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
