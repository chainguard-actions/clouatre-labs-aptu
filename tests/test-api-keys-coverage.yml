name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: 'sk-ant-placeholder-for-coverage'
          gemini-api-key: 'AIza-placeholder-for-coverage'
          openrouter-api-key: 'sk-or-placeholder-for-coverage'
          zai-api-key: 'zai-placeholder-for-coverage'
          instructions-file: '.github/instructions/pr-review.md'
          provider: 'openrouter'
          model: 'mistralai/mistral-small-2603'
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          skip-labeled: 'false'

      - name: Assert action completed (no event-specific steps run under workflow_dispatch)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch, event-gated steps (issue triage, PR review, PR label)
          # are skipped. The action should succeed (unconditional steps run fine).
          # The resolve-version step calls the GitHub API which may fail on sentinel repo,
          # so we accept both success and failure as valid outcomes.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' (expected under workflow_dispatch)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
