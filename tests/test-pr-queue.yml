name: Test pr-queue flag (graceful failure on sentinel repo)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # pr-queue=true triggers `aptu pr queue --repo $REPO`.
      # GITHUB_REPOSITORY is the sentinel (non-existent) repo, so the API call
      # will fail. The "Run aptu pr queue" step has continue-on-error: true in
      # the action, so the overall action should still succeed and emit metrics.
      # However, the binary install itself may fail in the act environment.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          pr-queue: 'true'
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'

      - name: Assert action completed (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — metrics should be present (zero since no AI calls completed)
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: action succeeded but input-tokens output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with metrics outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable, or act environment limitation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
