name: Test metrics defaults when no AI calls made
on:
  workflow_dispatch:

jobs:
  test-metrics-defaults:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up fake gh and aptu binaries so the action can run without network access.
      - name: Setup fake gh and aptu binaries
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"

          # Create a fake aptu binary
          cat > "$HOME/.local/bin/aptu" << 'APTU_EOF'
          #!/bin/bash
          echo "fake aptu called with: $*"
          exit 0
          APTU_EOF
          chmod +x "$HOME/.local/bin/aptu"

          # Pre-build fake archives for both architectures
          FAKE_VERSION="0.8.4"
          FAKE_STAGE=$(mktemp -d)
          mkdir -p "$FAKE_STAGE/content"
          cp "$HOME/.local/bin/aptu" "$FAKE_STAGE/content/aptu"

          for ARCH in x86_64 aarch64; do
            ARCHIVE="aptu-cli-${FAKE_VERSION}-${ARCH}-unknown-linux-musl.tar.gz"
            tar -czf "$FAKE_STAGE/$ARCHIVE" -C "$FAKE_STAGE/content" aptu
            SHA=$(sha256sum "$FAKE_STAGE/$ARCHIVE" | awk '{print $1}')
            echo "$SHA  $ARCHIVE" > "$FAKE_STAGE/${ARCHIVE%.tar.gz}.sha256"
          done

          echo "$FAKE_STAGE" > /tmp/aptu-fake-stage

          # Create fake gh binary
          cat > "$HOME/.local/bin/gh" << 'GH_EOF'
          #!/bin/bash
          FAKE_STAGE=$(cat /tmp/aptu-fake-stage 2>/dev/null || echo "")

          case "$1" in
            api)
              HAS_JQ=false
              for arg in "$@"; do
                if [[ "$arg" == "--jq" ]]; then HAS_JQ=true; fi
              done
              if $HAS_JQ; then
                echo "v0.8.4"
              else
                echo '[{"tag_name":"v0.8.4"}]'
              fi
              exit 0
              ;;
            release)
              DEST_DIR=""
              prev=""
              for arg in "$@"; do
                if [[ "$prev" == "-D" ]]; then DEST_DIR="$arg"; fi
                prev="$arg"
              done
              if [[ -n "$DEST_DIR" && -n "$FAKE_STAGE" ]]; then
                cp "$FAKE_STAGE"/*.tar.gz "$DEST_DIR/" 2>/dev/null || true
                cp "$FAKE_STAGE"/*.sha256 "$DEST_DIR/" 2>/dev/null || true
              fi
              exit 0
              ;;
            attestation)
              echo "Attestation verified (fake)"
              exit 0
              ;;
            *)
              exit 0
              ;;
          esac
          GH_EOF
          chmod +x "$HOME/.local/bin/gh"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # With workflow_dispatch, no AI-specific steps run (not issues/pull_request/schedule),
      # so the metrics-aggregate step should produce all-zero defaults.
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'
          pr-queue: 'false'

      - name: Assert input-tokens defaults to 0
        env:
          ACTUAL: ${{ steps.action.outputs.input-tokens }}
        run: |
          echo "input-tokens: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected input-tokens=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert output-tokens defaults to 0
        env:
          ACTUAL: ${{ steps.action.outputs.output-tokens }}
        run: |
          echo "output-tokens: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected output-tokens=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert duration-ms defaults to 0
        env:
          ACTUAL: ${{ steps.action.outputs.duration-ms }}
        run: |
          echo "duration-ms: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected duration-ms=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert cache-hit-ratio defaults to n/a
        env:
          ACTUAL: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "cache-hit-ratio: $ACTUAL"
          if [ "$ACTUAL" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio='n/a', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert effective-token-units defaults to 0
        env:
          ACTUAL: ${{ steps.action.outputs.effective-token-units }}
        run: |
          echo "effective-token-units: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected effective-token-units=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
