name: Test skip-labeled=false (no labels present)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under workflow_dispatch, github.event.issue.labels is empty/null.
      # With skip-labeled=true and no labels, check-skip should output skip=false.
      # The action will then attempt to resolve the aptu version (real API call),
      # install the binary, and set up PATH. No issue/PR steps fire on workflow_dispatch.
      # Binary installation (gh attestation verify) may fail in act, so we use
      # continue-on-error: true and accept graceful failure.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          skip-labeled: 'true'
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          # Provide a fallback provider so the fallback config step runs too
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'

      - name: Assert action completed (no event-specific steps fire on workflow_dispatch)
        env:
          STEP_OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $STEP_OUTCOME"
          # The action should either succeed or fail gracefully at binary install.
          # No issue/PR/schedule steps should have fired under workflow_dispatch.
          if [ "$STEP_OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully under workflow_dispatch"
          elif [ "$STEP_OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely binary install/attestation in act)"
          else
            echo "FAIL: unexpected step outcome '$STEP_OUTCOME'"
            exit 1
          fi
