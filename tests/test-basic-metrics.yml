name: Test basic metrics output (workflow_dispatch)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'
          skip-labeled: 'false'
        continue-on-error: true

      - name: Assert cache-hit-ratio output is set
        env:
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          if [ -z "$CACHE_HIT_RATIO" ]; then
            echo "FAIL: cache-hit-ratio output should not be empty"
            exit 1
          fi
          echo "PASS: cache-hit-ratio=$CACHE_HIT_RATIO"

      - name: Assert input-tokens output is set
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          if [ -z "$INPUT_TOKENS" ]; then
            echo "FAIL: input-tokens output should not be empty"
            exit 1
          fi
          echo "PASS: input-tokens=$INPUT_TOKENS"

      - name: Assert output-tokens output is set
        env:
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
        run: |
          echo "output-tokens: $OUTPUT_TOKENS"
          if [ -z "$OUTPUT_TOKENS" ]; then
            echo "FAIL: output-tokens output should not be empty"
            exit 1
          fi
          echo "PASS: output-tokens=$OUTPUT_TOKENS"

      - name: Assert duration-ms output is set
        env:
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
        run: |
          echo "duration-ms: $DURATION_MS"
          if [ -z "$DURATION_MS" ]; then
            echo "FAIL: duration-ms output should not be empty"
            exit 1
          fi
          echo "PASS: duration-ms=$DURATION_MS"

      - name: Assert effective-token-units output is set
        env:
          ETU: ${{ steps.action.outputs.effective-token-units }}
        run: |
          echo "effective-token-units: $ETU"
          if [ -z "$ETU" ]; then
            echo "FAIL: effective-token-units output should not be empty"
            exit 1
          fi
          echo "PASS: effective-token-units=$ETU"

      - name: Assert metrics are zero when no AI calls made
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "Checking metrics are zero/n/a when no AI calls were made"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          if [ "$INPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected input-tokens=0, got $INPUT_TOKENS"
            exit 1
          fi
          if [ "$OUTPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected output-tokens=0, got $OUTPUT_TOKENS"
            exit 1
          fi
          if [ "$DURATION_MS" != "0" ]; then
            echo "FAIL: expected duration-ms=0, got $DURATION_MS"
            exit 1
          fi
          if [ "$CACHE_HIT_RATIO" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio=n/a, got $CACHE_HIT_RATIO"
            exit 1
          fi
          echo "PASS: all metrics are zero/n/a as expected"
