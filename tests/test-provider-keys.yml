name: Test provider API keys and instructions-file inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create instructions file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.aptu-test"
          echo "# Review instructions for tests" > "$GITHUB_WORKSPACE/.aptu-test/pr-review.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: dummy-anthropic-key
          gemini-api-key: dummy-gemini-key
          openrouter-api-key: dummy-openrouter-key
          zai-api-key: dummy-zai-key
          provider: anthropic
          instructions-file: .aptu-test/pr-review.md
          dry-run: 'true'
          no-comment: 'true'
          fallback-provider: 'gemini'
          fallback-model: 'gemini-3.1-flash-lite'

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REVIEW: ${{ steps.action.outputs.pr-review-outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-review-outcome: '$REVIEW'"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          # Under workflow_dispatch the PR review step does not fire.
          if [ -n "$REVIEW" ]; then
            echo "FAIL: PR review should not run under workflow_dispatch"
            exit 1
          fi
          echo "PASS: PR review not run"

      - name: Assert fallback config written with given provider
        run: |
          CFG="$HOME/.config/aptu/config.toml"
          if [ ! -f "$CFG" ]; then
            echo "FAIL: $CFG not found"
            exit 1
          fi
          cat "$CFG"
          grep -q 'provider = "gemini"' "$CFG" || { echo "FAIL: provider missing"; exit 1; }
          grep -q 'model = "gemini-3.1-flash-lite"' "$CFG" || { echo "FAIL: model missing"; exit 1; }
          if grep -q 'dummy-' "$CFG"; then
            echo "FAIL: API key leaked into config"
            exit 1
          fi
          echo "PASS"
