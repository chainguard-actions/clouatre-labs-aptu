name: Test dry-run=true flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'

      - name: Assert action ran with dry-run flags (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          ETU: ${{ steps.action.outputs.effective-token-units }}
        run: |
          echo "dry-run=true, no-comment=true, apply-labels=false"
          echo "outcome: $OUTCOME"
          echo "input-tokens=$INPUT_TOKENS"
          echo "output-tokens=$OUTPUT_TOKENS"
          echo "duration-ms=$DURATION_MS"
          echo "cache-hit-ratio=$CACHE_HIT_RATIO"
          echo "effective-token-units=$ETU"

          if [ "$OUTCOME" = "success" ]; then
            # Verify all outputs are present and numeric where expected
            for val in "$INPUT_TOKENS" "$OUTPUT_TOKENS" "$DURATION_MS" "$ETU"; do
              if ! echo "$val" | grep -qE '^[0-9]+$'; then
                echo "FAIL: expected numeric output, got '$val'"
                exit 1
              fi
            done
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio is empty"
              exit 1
            fi
            echo "PASS: all outputs present and valid under dry-run mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely gh attestation verify not supported in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert aptu binary is installed (only if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v aptu > /dev/null 2>&1; then
              echo "FAIL: aptu binary not found on PATH after successful action"
              exit 1
            fi
            echo "PASS: aptu binary is available at $(command -v aptu)"
          else
            echo "SKIP: action did not succeed, skipping binary check"
          fi
