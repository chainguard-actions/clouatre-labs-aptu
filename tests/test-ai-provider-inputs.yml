name: Test AI provider inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: "test-anthropic-key"
          cerebras-api-key: "test-cerebras-key"
          gemini-api-key: "test-gemini-key"
          groq-api-key: "test-groq-key"
          openrouter-api-key: "test-openrouter-key"
          zai-api-key: "test-zai-key"
          zenmux-api-key: "test-zenmux-key"
          instructions-file: ""
          dry-run: "true"
          no-comment: "true"
          apply-labels: "false"
          skip-labeled: "false"
          pr-queue: "false"

      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # The action either succeeds (binary installed, no AI steps ran under workflow_dispatch)
          # or fails gracefully (e.g. GitHub API rate limit or release not found).
          # In both cases, metrics-aggregate always runs and sets outputs.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            # Metrics outputs should always be set (metrics-aggregate runs with if: always())
            # When no AI calls were made, tokens should be 0 and cache_hit_ratio should be n/a
            if [ -z "$INPUT_TOKENS" ] && [ -z "$OUTPUT_TOKENS" ] && [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: all metric outputs are empty — metrics-aggregate step did not run"
              exit 1
            fi
            echo "PASS: action ran (outcome=$OUTCOME) and metrics outputs are present"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
