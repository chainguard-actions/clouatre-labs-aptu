name: Test existing user config is preserved
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure a recent gh CLI (with attestation support) is available
        run: |
          if command -v gh >/dev/null 2>&1 && gh attestation --help >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          case "$(uname -m)" in
            x86_64) A=amd64 ;;
            aarch64|arm64) A=arm64 ;;
            *) echo "unsupported arch"; exit 1 ;;
          esac
          V=2.65.0
          curl -fsSL "https://github.com/cli/cli/releases/download/v${V}/gh_${V}_linux_${A}.tar.gz" -o /tmp/gh.tgz
          tar -xzf /tmp/gh.tgz -C /tmp
          mkdir -p "$HOME/gh-cli"
          cp "/tmp/gh_${V}_linux_${A}/bin/gh" "$HOME/gh-cli/gh"
          echo "$HOME/gh-cli" >> "$GITHUB_PATH"
      - name: Pre-create user-managed config
        run: |
          rm -rf "$HOME/.config/aptu"
          mkdir -p "$HOME/.config/aptu"
          printf '# user managed\n[ai]\nprovider = "anthropic"\n' > "$HOME/.config/aptu/config.toml"
          cp "$HOME/.config/aptu/config.toml" /tmp/expected-config.toml
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          fallback-provider: zai
          fallback-model: some-model
      - name: Assert config unchanged
        run: |
          CFG="$HOME/.config/aptu/config.toml"
          cat "$CFG"
          if ! cmp -s "$CFG" /tmp/expected-config.toml; then
            echo "FAIL: user-managed config was modified"
            exit 1
          fi
          if grep -qF 'ai.fallback' "$CFG"; then
            echo "FAIL: fallback section should not have been added"
            exit 1
          fi
          echo "PASS"
