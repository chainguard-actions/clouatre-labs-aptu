name: Test action works without fallback provider
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake gh and aptu for testing
        run: |
          set -euo pipefail

          # Build a minimal fake aptu tarball that the fake gh will serve
          mkdir -p /tmp/fake-aptu-src /tmp/fake-aptu-release
          printf '#!/bin/sh\necho "fake aptu $*"\nexit 0\n' > /tmp/fake-aptu-src/aptu
          chmod +x /tmp/fake-aptu-src/aptu
          tar -czf /tmp/fake-aptu-release/fake.tar.gz -C /tmp/fake-aptu-src aptu

          # Install fake gh wrapper (uses fixture script)
          REAL_GH="$(command -v gh || echo /usr/bin/gh)"
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-gh.sh" "$HOME/.local/bin/gh"
          sed -i "s|REAL_GH_PATH:-/usr/bin/gh|REAL_GH_PATH:-$REAL_GH|g" "$HOME/.local/bin/gh"
          chmod +x "$HOME/.local/bin/gh"

          # Prepend our bin dir to PATH for this and subsequent steps
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          fallback-provider: ''
          fallback-model: ''
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          skip-labeled: 'false'

      - name: Assert fallback config file was NOT written
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          echo "Checking that config file does NOT exist at: $CONFIG_FILE"
          if [ -f "$CONFIG_FILE" ]; then
            echo "Config file contents (unexpected):"
            cat "$CONFIG_FILE"
            echo "FAIL: config.toml was created but should not have been (no fallback provider set)"
            exit 1
          fi
          echo "PASS: config.toml correctly not created when fallback-provider is empty"

      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          ETU: ${{ steps.action.outputs.effective-token-units }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_RATIO"
          echo "effective-token-units: $ETU"

          for var in INPUT_TOKENS OUTPUT_TOKENS DURATION_MS CACHE_RATIO ETU; do
            val="${!var}"
            if [ -z "$val" ]; then
              echo "FAIL: output $var is empty"
              exit 1
            fi
          done

          echo "PASS: all metric outputs are set"
