name: Test AI provider API keys coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: "test-anthropic-key"
          cerebras-api-key: "test-cerebras-key"
          gemini-api-key: "test-gemini-key"
          groq-api-key: "test-groq-key"
          openrouter-api-key: "test-openrouter-key"
          zai-api-key: "test-zai-key"
          zenmux-api-key: "test-zenmux-key"
          dry-run: "true"
          no-comment: "true"
          skip-labeled: "false"

      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          EFFECTIVE_TOKEN_UNITS: ${{ steps.action.outputs.effective-token-units }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          echo "effective-token-units: $EFFECTIVE_TOKEN_UNITS"

          # The action either succeeds (workflow_dispatch doesn't trigger AI steps,
          # so metrics default to zero) or fails gracefully (sentinel repo not resolvable).
          if [ "$OUTCOME" = "success" ]; then
            # Metrics outputs must be set (even if zero)
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: input-tokens output is empty"
              exit 1
            fi
            if [ -z "$OUTPUT_TOKENS" ]; then
              echo "FAIL: output-tokens output is empty"
              exit 1
            fi
            if [ -z "$DURATION_MS" ]; then
              echo "FAIL: duration-ms output is empty"
              exit 1
            fi
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio output is empty"
              exit 1
            fi
            if [ -z "$EFFECTIVE_TOKEN_UNITS" ]; then
              echo "FAIL: effective-token-units output is empty"
              exit 1
            fi
            echo "PASS: all metric outputs are set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable or API rate limit)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
