name: Test API key inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create instructions file
        run: |
          mkdir -p /tmp/aptu-test
          echo "# PR Review Instructions" > /tmp/aptu-test/instructions.md
          echo "Review for correctness and style." >> /tmp/aptu-test/instructions.md

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: 'sk-ant-placeholder'
          cerebras-api-key: 'csk-placeholder'
          gemini-api-key: 'AIza-placeholder'
          groq-api-key: 'gsk_placeholder'
          openrouter-api-key: 'sk-or-placeholder'
          zai-api-key: 'zai-placeholder'
          zenmux-api-key: 'zmx-placeholder'
          instructions-file: '/tmp/aptu-test/instructions.md'
          dry-run: 'true'
          no-comment: 'true'
          pr-queue: 'false'

      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # Under workflow_dispatch no AI steps fire, so tokens should be 0
          if [ "$INPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected input-tokens=0, got '$INPUT_TOKENS'"
            exit 1
          fi
          if [ "$OUTPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected output-tokens=0, got '$OUTPUT_TOKENS'"
            exit 1
          fi
          if [ "$DURATION_MS" != "0" ]; then
            echo "FAIL: expected duration-ms=0, got '$DURATION_MS'"
            exit 1
          fi
          if [ "$CACHE_HIT_RATIO" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio=n/a, got '$CACHE_HIT_RATIO'"
            exit 1
          fi
          echo "PASS: all metrics outputs are present and correct for a no-op run"
