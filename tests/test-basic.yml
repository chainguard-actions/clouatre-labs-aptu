name: Test basic usage (workflow_dispatch, no AI calls)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake gh wrapper to mock aptu binary installation
        run: |
          mkdir -p /tmp/fake-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-gh.sh" /tmp/fake-bin/gh
          chmod +x /tmp/fake-bin/gh
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          # No scan-path, no pr-queue, no AI keys — only metrics-aggregate fires
          dry-run: 'true'

      - name: Assert action ran and metrics outputs are present
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          ETU: ${{ steps.action.outputs.effective-token-units }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          echo "effective-token-units: $ETU"

          if [ "$OUTCOME" = "success" ]; then
            # Verify all numeric outputs
            for val in "$INPUT_TOKENS" "$OUTPUT_TOKENS" "$DURATION_MS" "$ETU"; do
              if ! echo "$val" | grep -qE '^[0-9]+$'; then
                echo "FAIL: expected numeric metric output, got '$val'"
                exit 1
              fi
            done
            if [ "$CACHE_HIT_RATIO" != "n/a" ]; then
              echo "FAIL: expected cache-hit-ratio=n/a (no AI calls), got '$CACHE_HIT_RATIO'"
              exit 1
            fi
            echo "PASS: action succeeded with valid metric outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (infrastructure issue in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
