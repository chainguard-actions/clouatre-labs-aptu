name: Test all AI provider keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: dummy-anthropic-key
          cerebras-api-key: dummy-cerebras-key
          gemini-api-key: dummy-gemini-key
          groq-api-key: dummy-groq-key
          openrouter-api-key: dummy-openrouter-key
          zai-api-key: dummy-zai-key
          zenmux-api-key: dummy-zenmux-key
          instructions-file: ''
          dry-run: 'true'
          skip-labeled: 'false'
          no-comment: 'true'
          apply-labels: 'false'
          pr-queue: 'false'

      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # With workflow_dispatch, no AI steps run, so metrics should be zero/n/a
          if [ "$INPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected input-tokens=0, got '$INPUT_TOKENS'"
            exit 1
          fi
          if [ "$OUTPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected output-tokens=0, got '$OUTPUT_TOKENS'"
            exit 1
          fi
          if [ "$DURATION_MS" != "0" ]; then
            echo "FAIL: expected duration-ms=0, got '$DURATION_MS'"
            exit 1
          fi
          if [ "$CACHE_HIT_RATIO" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio=n/a, got '$CACHE_HIT_RATIO'"
            exit 1
          fi
          echo "PASS: all metrics outputs are correct for a no-op run"
