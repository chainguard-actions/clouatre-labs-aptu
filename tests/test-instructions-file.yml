name: Test instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          instructions-file: 'hardened/tests/fixtures/pr-review-instructions.md'
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          pr-queue: 'false'

      - name: Assert action ran and metrics outputs are set
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # Under workflow_dispatch, the PR review step (which uses instructions-file) does not
          # fire. The action either succeeds (aptu installed, no AI steps fired) or fails
          # gracefully (sentinel repo / network). Metrics-aggregate always runs.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with instructions-file input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
