name: Test basic usage (workflow_dispatch, no triage/review)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install gh CLI (not present in the act runner image)
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then gh --version; exit 0; fi
          GH_VERSION=2.63.2
          case "$(uname -m)" in
            aarch64|arm64) GH_ARCH=arm64 ;;
            *) GH_ARCH=amd64 ;;
          esac
          DEST="$HOME/.gh-cli"
          mkdir -p "$DEST"
          curl -sSfL -o /tmp/gh.tar.gz "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${GH_ARCH}.tar.gz"
          tar -xzf /tmp/gh.tar.gz -C "$DEST" --strip-components=1
          "$DEST/bin/gh" --version
          echo "$DEST/bin" >> "$GITHUB_PATH"
      - name: Ensure no pre-existing aptu config
        run: rm -f "$HOME/.config/aptu/config.toml"
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'
      - name: Assert aptu binary installed and on PATH
        run: |
          echo "HOME=$HOME"
          ls -l "$HOME/.local/bin/aptu" || true
          if [ ! -x "$HOME/.local/bin/aptu" ]; then
            echo "FAIL: aptu binary not installed at $HOME/.local/bin/aptu"
            exit 1
          fi
          if ! command -v aptu >/dev/null 2>&1; then
            echo "FAIL: aptu not on PATH"
            exit 1
          fi
          aptu --version || { echo "FAIL: aptu --version failed"; exit 1; }
          echo "PASS"
      - name: Assert default fallback config written
        run: |
          CFG="$HOME/.config/aptu/config.toml"
          cat "$CFG" || { echo "FAIL: config not written"; exit 1; }
          if ! grep -q '\[ai.fallback\]' "$CFG"; then
            echo "FAIL: missing [ai.fallback] section"; exit 1
          fi
          if ! grep -q 'provider = "openrouter"' "$CFG"; then
            echo "FAIL: default fallback provider not openrouter"; exit 1
          fi
          if ! grep -q 'model = "inception/mercury-2"' "$CFG"; then
            echo "FAIL: default fallback model not inception/mercury-2"; exit 1
          fi
          echo "PASS"
      - name: Assert PR review did not run
        env:
          ACTUAL: ${{ steps.action.outputs.pr-review-outcome }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: pr-review-outcome should be empty for workflow_dispatch"
            exit 1
          fi
          echo "PASS"
