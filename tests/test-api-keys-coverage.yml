name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create instructions file for test
        run: |
          mkdir -p /tmp/aptu-test
          echo "# Test instructions" > /tmp/aptu-test/pr-review.md

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: "dummy-anthropic-key"
          cerebras-api-key: "dummy-cerebras-key"
          gemini-api-key: "dummy-gemini-key"
          groq-api-key: "dummy-groq-key"
          openrouter-api-key: "dummy-openrouter-key"
          zai-api-key: "dummy-zai-key"
          zenmux-api-key: "dummy-zenmux-key"
          instructions-file: "/tmp/aptu-test/pr-review.md"
          dry-run: "true"
          no-comment: "true"
          apply-labels: "false"
          pr-queue: "false"
        continue-on-error: true

      - name: Assert action completed (metrics outputs present)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          if [ "$OUTCOME" = "success" ]; then
            # Under workflow_dispatch no AI steps fire, so tokens should be 0
            if [ "$INPUT_TOKENS" != "0" ] && [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: expected input-tokens to be 0 or set, got: '$INPUT_TOKENS'"
              exit 1
            fi
            if [ "$CACHE_HIT_RATIO" != "n/a" ] && [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: expected cache-hit-ratio to be n/a or set, got: '$CACHE_HIT_RATIO'"
              exit 1
            fi
            echo "PASS: action succeeded with all API key inputs provided"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API key validation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
