name: Test fallback AI config writing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake gh wrapper to mock aptu binary installation
        run: |
          mkdir -p /tmp/fake-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-gh.sh" /tmp/fake-bin/gh
          chmod +x /tmp/fake-bin/gh
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      # When fallback-provider and fallback-model are set, the action writes
      # $HOME/.config/aptu/config.toml with the fallback chain.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          dry-run: 'true'

      - name: Assert fallback config file was written (on success)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"

          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (infrastructure issue in act environment)"
            exit 0
          fi

          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          echo "Checking for config file at: $CONFIG_FILE"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: expected config file not found at $CONFIG_FILE"
            exit 1
          fi
          echo "Config file contents:"
          cat "$CONFIG_FILE"

          # Verify the config contains the expected fallback provider
          if ! grep -q 'openrouter' "$CONFIG_FILE"; then
            echo "FAIL: config file does not contain 'openrouter'"
            exit 1
          fi

          # Verify the config contains the expected fallback model
          if ! grep -q 'inception/mercury-2' "$CONFIG_FILE"; then
            echo "FAIL: config file does not contain 'inception/mercury-2'"
            exit 1
          fi

          # Verify the config has the expected TOML structure
          if ! grep -q '\[ai.fallback\]' "$CONFIG_FILE"; then
            echo "FAIL: config file does not contain '[ai.fallback]' section"
            exit 1
          fi

          echo "PASS: fallback config file written correctly"

      - name: Assert metrics outputs are present (on success)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully, skipping metrics check"
            exit 0
          fi

          if ! echo "$INPUT_TOKENS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected numeric input-tokens, got '$INPUT_TOKENS'"
            exit 1
          fi
          if [ "$CACHE_HIT_RATIO" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio=n/a, got '$CACHE_HIT_RATIO'"
            exit 1
          fi
          echo "PASS"
