name: Test skip-labeled=true with no labels (should not skip)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When skip-labeled=true but the issue has no type+priority labels,
      # the action should NOT skip. Under workflow_dispatch, github.event.issue.labels
      # is null/empty, so skip should be false and aptu should proceed to install.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          skip-labeled: 'true'
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'

      - name: Assert action completed (success or graceful failure in act environment)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"

          # The action should NOT have skipped (skip=false when no type+priority labels).
          # If it had skipped, the resolve-version step would be skipped and the action
          # would succeed trivially with empty outputs. Either way, the action should
          # not fail due to the skip-labeled logic itself.
          if [ "$OUTCOME" = "success" ]; then
            # Metrics should be zero (no AI calls under workflow_dispatch)
            if [ "$INPUT_TOKENS" != "0" ]; then
              echo "FAIL: expected input-tokens=0, got '$INPUT_TOKENS'"
              exit 1
            fi
            if [ "$OUTPUT_TOKENS" != "0" ]; then
              echo "FAIL: expected output-tokens=0, got '$OUTPUT_TOKENS'"
              exit 1
            fi
            echo "PASS: action succeeded with zero metrics (no AI calls under workflow_dispatch)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (act environment limitation: gh attestation verify or actions/cache not available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
