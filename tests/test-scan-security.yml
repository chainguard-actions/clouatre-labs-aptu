name: Test scan-security with scan-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that scan-security fires when scan-path is set.
      # The scan step has continue-on-error: true when fail-on is empty,
      # so even if aptu scan-security finds issues or the AI call fails,
      # the action completes and metrics outputs are set.
      # We scan the tests directory (safe, no secrets).
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          scan-path: 'tests'
          fail-on: ''
          sarif-upload: 'false'
          dry-run: 'true'

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert metrics outputs on success
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: input-tokens output is empty — metrics-aggregate did not run"
              exit 1
            fi
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio output is empty"
              exit 1
            fi
            echo "PASS: action completed with scan-path set, metrics outputs are present"
          else
            echo "PASS: action failed gracefully (binary install/attestation may not be available in act)"
          fi
