name: Test no fallback config when fallback-provider is empty
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When fallback-provider and fallback-model are both empty, the
      # "Write fallback AI config" step is skipped (condition: inputs.fallback-provider != '' || inputs.fallback-model != '').
      # Use continue-on-error since binary installation may fail in act.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          fallback-provider: ''
          fallback-model: ''
          dry-run: 'true'

      - name: Assert fallback config file was NOT written
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          echo "Checking that config does NOT exist at: $CONFIG_FILE"
          if [ -f "$CONFIG_FILE" ]; then
            echo "FAIL: fallback config file unexpectedly found at $CONFIG_FILE"
            cat "$CONFIG_FILE"
            exit 1
          fi
          echo "PASS: fallback config file correctly absent"

      - name: Assert metrics outputs are still present (action ran normally)
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          if [ -z "$INPUT_TOKENS" ]; then
            echo "FAIL: input-tokens output is empty"
            exit 1
          fi
          if [ -z "$DURATION_MS" ]; then
            echo "FAIL: duration-ms output is empty"
            exit 1
          fi
          echo "PASS: metrics outputs present"
