name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          # AI provider API keys (all covered in this test)
          anthropic-api-key: 'dummy-anthropic-key'
          cerebras-api-key: 'dummy-cerebras-key'
          gemini-api-key: 'dummy-gemini-key'
          groq-api-key: 'dummy-groq-key'
          openrouter-api-key: 'dummy-openrouter-key'
          zai-api-key: 'dummy-zai-key'
          zenmux-api-key: 'dummy-zenmux-key'
          # instructions-file input coverage
          instructions-file: '.github/instructions/pr-review.md'
          # Use dry-run and skip-labeled false to avoid side effects
          dry-run: 'true'
          skip-labeled: 'false'
          # Disable pr-queue to avoid unnecessary API calls
          pr-queue: 'false'
          # Fallback config
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'

      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          EFFECTIVE_TOKEN_UNITS: ${{ steps.action.outputs.effective-token-units }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          echo "effective-token-units: $EFFECTIVE_TOKEN_UNITS"

          # Under workflow_dispatch no AI steps fire, so metrics are 0/n/a
          # We just assert the outputs are set (not empty)
          if [ -z "$INPUT_TOKENS" ]; then
            echo "FAIL: input-tokens output is empty"
            exit 1
          fi
          if [ -z "$OUTPUT_TOKENS" ]; then
            echo "FAIL: output-tokens output is empty"
            exit 1
          fi
          if [ -z "$DURATION_MS" ]; then
            echo "FAIL: duration-ms output is empty"
            exit 1
          fi
          if [ -z "$CACHE_HIT_RATIO" ]; then
            echo "FAIL: cache-hit-ratio output is empty"
            exit 1
          fi
          if [ -z "$EFFECTIVE_TOKEN_UNITS" ]; then
            echo "FAIL: effective-token-units output is empty"
            exit 1
          fi
          echo "PASS: all metric outputs are set"
