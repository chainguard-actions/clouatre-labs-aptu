name: Test lint-issue step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a sample issue body file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/sample-issue.md" << 'EOF'
          ## Summary
          This is a test issue for the lint-issue step.

          ## Steps to reproduce
          1. Run the action
          2. Observe the output

          ## Expected behavior
          The lint step should run and produce an outcome.

          ## Actual behavior
          TBD
          EOF

      - name: Install fake aptu binary
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/aptu" << 'APTU_EOF'
          #!/bin/sh
          echo "fake aptu called with: $*"
          # Simulate lint-issue success
          case "$*" in
            *lint-issue*)
              echo "Lint passed: no violations found"
              exit 0
              ;;
            *issue\ triage*)
              echo "Issue triage skipped (fake)"
              exit 0
              ;;
            *pr\ label*)
              echo "PR label skipped (fake)"
              exit 0
              ;;
            *pr\ review*)
              echo "PR review skipped (fake)"
              exit 0
              ;;
            *)
              echo "Unknown command: $*"
              exit 0
              ;;
          esac
          APTU_EOF
          chmod +x "$HOME/.local/bin/aptu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          lint-issue-file: '${{ github.workspace }}/tests/fixtures/sample-issue.md'
          lint-issue-type: 'bug'
          lint-fail-on: 'false'
          dry-run: 'true'
        continue-on-error: true

      - name: Assert lint-issue-outcome is set
        env:
          LINT_OUTCOME: ${{ steps.action.outputs.lint-issue-outcome }}
          ACTION_OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $ACTION_OUTCOME"
          echo "lint-issue-outcome: $LINT_OUTCOME"
          # The action may fail at version resolution (real API call) or succeed
          # If it succeeded, lint-issue-outcome should be set
          if [ "$ACTION_OUTCOME" = "success" ]; then
            if [ -z "$LINT_OUTCOME" ]; then
              echo "FAIL: action succeeded but lint-issue-outcome is empty"
              exit 1
            fi
            echo "PASS: lint-issue-outcome='$LINT_OUTCOME'"
          elif [ "$ACTION_OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely version resolution or binary install)"
          else
            echo "FAIL: unexpected outcome '$ACTION_OUTCOME'"
            exit 1
          fi
