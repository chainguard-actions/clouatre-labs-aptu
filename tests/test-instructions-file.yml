name: Test instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy instructions file
        run: |
          mkdir -p "$RUNNER_TEMP/aptu-test"
          cat > "$RUNNER_TEMP/aptu-test/pr-review.md" <<'EOF'
          # PR Review Instructions
          Please review the PR for correctness and style.
          EOF
          echo "Created instructions file at $RUNNER_TEMP/aptu-test/pr-review.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          instructions-file: "${{ runner.temp }}/aptu-test/pr-review.md"
          dry-run: "true"
          no-comment: "true"
          skip-labeled: "false"

      - name: Assert action ran and metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # The action either succeeds (workflow_dispatch doesn't trigger PR review steps,
          # so metrics default to zero) or fails gracefully (sentinel repo not resolvable).
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: input-tokens output is empty"
              exit 1
            fi
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with instructions-file input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable or API rate limit)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
