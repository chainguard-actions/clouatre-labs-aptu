name: Test pr-queue disabled (default false)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gh mock and fake aptu binary
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            aarch64|arm64) ARCH="aarch64" ;;
            x86_64)        ARCH="x86_64"  ;;
          esac
          FAKE_VERSION="0.99.0"
          ARCHIVE="aptu-cli-${FAKE_VERSION}-${ARCH}-unknown-linux-musl.tar.gz"

          mkdir -p /tmp/fake-aptu-src
          printf '#!/bin/sh\necho "fake aptu $*"\nexit 0\n' > /tmp/fake-aptu-src/aptu
          chmod +x /tmp/fake-aptu-src/aptu

          tar -czf "/tmp/${ARCHIVE}" -C /tmp/fake-aptu-src aptu
          (cd /tmp && sha256sum "${ARCHIVE}" > "${ARCHIVE%.tar.gz}.sha256")

          echo "$FAKE_VERSION" > /tmp/fake-aptu-version
          echo "$ARCH" > /tmp/fake-aptu-arch
          echo "$ARCHIVE" > /tmp/fake-aptu-archive

          REAL_GH="$(command -v gh || echo /usr/bin/gh)"
          mkdir -p "$HOME/.local/bin"
          printf '%s\n' '#!/bin/sh' \
            'FAKE_VERSION="$(cat /tmp/fake-aptu-version)"' \
            'ARCH="$(cat /tmp/fake-aptu-arch)"' \
            'ARCHIVE="$(cat /tmp/fake-aptu-archive)"' \
            'case "$*" in' \
            '  *"repos/clouatre-labs/aptu/releases"*)' \
            '    printf "v%s\n" "$FAKE_VERSION"' \
            '    exit 0' \
            '    ;;' \
            '  *"release download"*)' \
            '    DEST_DIR=""' \
            '    PREV=""' \
            '    for arg in "$@"; do' \
            '      if [ "$PREV" = "-D" ]; then DEST_DIR="$arg"; fi' \
            '      PREV="$arg"' \
            '    done' \
            '    if [ -n "$DEST_DIR" ]; then' \
            '      cp "/tmp/${ARCHIVE}" "$DEST_DIR/${ARCHIVE}"' \
            '      cp "/tmp/${ARCHIVE%.tar.gz}.sha256" "$DEST_DIR/${ARCHIVE%.tar.gz}.sha256"' \
            '    fi' \
            '    exit 0' \
            '    ;;' \
            '  *"attestation verify"*)' \
            '    echo "gh attestation verify: skipped in act (mock)"' \
            '    exit 0' \
            '    ;;' \
            'esac' \
            "exec \"${REAL_GH}\" \"\$@\"" \
            > "$HOME/.local/bin/gh"
          chmod +x "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          pr-queue: 'false'
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          skip-labeled: 'false'

      - name: Assert action completed with zero metrics
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          ETU: ${{ steps.action.outputs.effective-token-units }}
          CACHE_HIT: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "effective-token-units: $ETU"
          echo "cache-hit-ratio: $CACHE_HIT"

          FAIL=0
          if [ "$INPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected input-tokens=0, got '$INPUT_TOKENS'"
            FAIL=1
          fi
          if [ "$OUTPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected output-tokens=0, got '$OUTPUT_TOKENS'"
            FAIL=1
          fi
          if [ "$DURATION_MS" != "0" ]; then
            echo "FAIL: expected duration-ms=0, got '$DURATION_MS'"
            FAIL=1
          fi
          if [ "$ETU" != "0" ]; then
            echo "FAIL: expected effective-token-units=0, got '$ETU'"
            FAIL=1
          fi
          if [ "$CACHE_HIT" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio=n/a, got '$CACHE_HIT'"
            FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then
            exit 1
          fi
          echo "PASS: all metrics are zero/n/a as expected"
