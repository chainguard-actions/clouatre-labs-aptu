name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          # AI provider API keys (all covered in this test)
          anthropic-api-key: 'dummy-anthropic-key'
          cerebras-api-key: 'dummy-cerebras-key'
          gemini-api-key: 'dummy-gemini-key'
          groq-api-key: 'dummy-groq-key'
          openrouter-api-key: 'dummy-openrouter-key'
          zai-api-key: 'dummy-zai-key'
          zenmux-api-key: 'dummy-zenmux-key'
          # PR review input
          instructions-file: '.github/instructions/pr-review.md'
          # Behavior flags
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          skip-labeled: 'false'
          # No scan-path, no pr-queue — only check-skip + metrics steps fire under workflow_dispatch

      - name: Assert metrics outputs are set (defaults when no AI calls made)
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # The action may succeed or fail (sentinel repo may cause resolve-version to fail
          # or the binary install may fail). Either way, metrics-aggregate runs with if: always()
          # and should emit outputs.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

          # Metrics outputs should be set (either 0 or a numeric value)
          # cache-hit-ratio is either "n/a" or a percentage
          if [ -z "$CACHE_HIT_RATIO" ]; then
            echo "FAIL: cache-hit-ratio output is empty (metrics-aggregate did not run)"
            exit 1
          fi
          echo "PASS: metrics outputs are set"
