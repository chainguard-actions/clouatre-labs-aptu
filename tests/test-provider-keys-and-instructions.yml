name: Test provider API keys and instructions-file inputs (workflow_dispatch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create instructions file
        run: |
          mkdir -p "$RUNNER_TEMP/aptu-test"
          printf '# Review instructions\nBe concise.\n' > "$RUNNER_TEMP/aptu-test/instructions.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: dummy-anthropic-key
          gemini-api-key: dummy-gemini-key
          openrouter-api-key: dummy-openrouter-key
          zai-api-key: dummy-zai-key
          provider: gemini
          model: gemini-3.1-flash-lite
          instructions-file: ${{ runner.temp }}/aptu-test/instructions.md
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          skip-labeled: 'false'

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REVIEW_OUTCOME: ${{ steps.action.outputs.pr-review-outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "pr-review-outcome: '$REVIEW_OUTCOME'"
          if [ "$OUTCOME" = "success" ]; then
            # Under workflow_dispatch no PR review step runs, so the output must be empty
            if [ -n "$REVIEW_OUTCOME" ]; then
              echo "FAIL: pr-review-outcome should be empty under workflow_dispatch"
              exit 1
            fi
            if ! command -v aptu >/dev/null 2>&1 && [ ! -f "$HOME/.local/bin/aptu" ]; then
              echo "FAIL: aptu binary not found after successful action"
              exit 1
            fi
            echo "PASS: action succeeded with provider keys and instructions-file set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (harness constraints on release download/attestation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert fallback config written with defaults
        run: |
          CFG="$HOME/.config/aptu/config.toml"
          if [ ! -f "$CFG" ]; then
            echo "FAIL: $CFG not found"
            exit 1
          fi
          cat "$CFG"
          if ! grep -q 'provider = "openrouter"' "$CFG" || ! grep -q 'model = "inception/mercury-2"' "$CFG"; then
            echo "FAIL: fallback config missing default provider/model"
            exit 1
          fi
          if grep -q 'dummy-' "$CFG"; then
            echo "FAIL: API key leaked into config file"
            exit 1
          fi
          echo "PASS"
