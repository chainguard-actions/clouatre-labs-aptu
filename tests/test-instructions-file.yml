name: Test instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy instructions file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/instructions"
          echo "# PR Review Instructions" > "$GITHUB_WORKSPACE/.github/instructions/pr-review.md"
          echo "Review all changes carefully." >> "$GITHUB_WORKSPACE/.github/instructions/pr-review.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          instructions-file: ".github/instructions/pr-review.md"
          dry-run: "true"
          no-comment: "true"
          apply-labels: "false"
          pr-queue: "false"

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness with sentinel repo or unavailable upstream)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
