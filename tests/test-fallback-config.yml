name: Test fallback AI config writing
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When fallback-provider and fallback-model are set, the action writes
      # $HOME/.config/aptu/config.toml with the fallback chain.
      # This step runs before the aptu install step, so the config file
      # should be written even if the action later fails during installation.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action outcome is '$OUTCOME'"

      - name: Assert fallback config file was written
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          echo "Checking for config file at: $CONFIG_FILE"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: config.toml was not created at $CONFIG_FILE"
            exit 1
          fi
          echo "Config file contents:"
          cat "$CONFIG_FILE"

          # Verify the config contains the expected fallback provider
          if ! grep -q 'openrouter' "$CONFIG_FILE"; then
            echo "FAIL: config.toml does not contain 'openrouter'"
            exit 1
          fi

          # Verify the config contains the expected fallback model
          if ! grep -q 'inception/mercury-2' "$CONFIG_FILE"; then
            echo "FAIL: config.toml does not contain 'inception/mercury-2'"
            exit 1
          fi

          # Verify the config has the [ai.fallback] section
          if ! grep -q '\[ai.fallback\]' "$CONFIG_FILE"; then
            echo "FAIL: config.toml does not contain [ai.fallback] section"
            exit 1
          fi

          echo "PASS: fallback config file written correctly"

      - name: Assert metrics outputs are present when action succeeded
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: input-tokens output is empty"
              exit 1
            fi
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio output is empty"
              exit 1
            fi
            echo "PASS: metrics outputs are present"
          else
            echo "PASS: action failed gracefully (aptu install may not be supported in this environment)"
          fi
