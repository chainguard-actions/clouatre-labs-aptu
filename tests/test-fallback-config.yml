name: Test fallback AI config is written
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          dry-run: 'true'
          skip-labeled: 'false'
        continue-on-error: true

      - name: Assert fallback config file was written
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          echo "Checking for config file at: $CONFIG_FILE"
          if [ -f "$CONFIG_FILE" ]; then
            echo "Config file contents:"
            cat "$CONFIG_FILE"
            # Verify it contains the expected fallback provider
            if grep -q 'openrouter' "$CONFIG_FILE"; then
              echo "PASS: fallback config written with correct provider"
            else
              echo "FAIL: config file exists but does not contain 'openrouter'"
              exit 1
            fi
            # Verify it contains the expected fallback model
            if grep -q 'inception/mercury-2' "$CONFIG_FILE"; then
              echo "PASS: fallback config written with correct model"
            else
              echo "FAIL: config file exists but does not contain 'inception/mercury-2'"
              exit 1
            fi
          else
            echo "FAIL: fallback config file not found at $CONFIG_FILE"
            exit 1
          fi
