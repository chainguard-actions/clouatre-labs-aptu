name: Test scan-security step fires when scan-path is set
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          scan-path: '.'
          fail-on: ''
          sarif-upload: 'false'
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'

      - name: Assert action ran and produced a defined outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may succeed or fail depending on whether the aptu binary
          # can be installed and whether an AI key is available.
          # What we assert is that it ran (not skipped) and produced a defined outcome.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (scan completed)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected without AI API key or in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
