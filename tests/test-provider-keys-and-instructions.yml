name: Test provider API keys and instructions-file inputs (non-PR event)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under workflow_dispatch, none of the issue/PR/schedule steps fire, so the
      # dummy provider keys are never sent anywhere. The binary install
      # (attestation verify) may not succeed under act, hence continue-on-error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: 'dummy-anthropic-key'
          gemini-api-key: 'dummy-gemini-key'
          openrouter-api-key: 'dummy-openrouter-key'
          zai-api-key: 'dummy-zai-key'
          provider: 'anthropic'
          instructions-file: hardened/tests/fixtures/pr-review-instructions.md
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'

      - name: Assert action ran and PR review did not fire on workflow_dispatch
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_REVIEW: ${{ steps.action.outputs.pr-review-outcome }}
          LINT: ${{ steps.action.outputs.lint-issue-outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr-review-outcome: '$PR_REVIEW'"
          echo "lint-issue-outcome: '$LINT'"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          if [ -n "$PR_REVIEW" ]; then
            echo "FAIL: pr-review step should not run for workflow_dispatch"
            exit 1
          fi
          if [ -n "$LINT" ]; then
            echo "FAIL: lint-issue step should not run without lint-issue-file"
            exit 1
          fi
          echo "PASS"
