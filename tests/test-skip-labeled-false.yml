name: Test skip-labeled=false always processes issues
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake gh and aptu for testing
        run: |
          set -euo pipefail

          # Build a minimal fake aptu tarball that the fake gh will serve
          mkdir -p /tmp/fake-aptu-src /tmp/fake-aptu-release
          printf '#!/bin/sh\necho "fake aptu $*"\nexit 0\n' > /tmp/fake-aptu-src/aptu
          chmod +x /tmp/fake-aptu-src/aptu
          tar -czf /tmp/fake-aptu-release/fake.tar.gz -C /tmp/fake-aptu-src aptu

          # Install fake gh wrapper (uses fixture script)
          REAL_GH="$(command -v gh || echo /usr/bin/gh)"
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-gh.sh" "$HOME/.local/bin/gh"
          sed -i "s|REAL_GH_PATH:-/usr/bin/gh|REAL_GH_PATH:-$REAL_GH|g" "$HOME/.local/bin/gh"
          chmod +x "$HOME/.local/bin/gh"

          # Prepend our bin dir to PATH for this and subsequent steps
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          skip-labeled: 'false'
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'

      - name: Assert metrics outputs are present (action completed)
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_RATIO"

          # All outputs must be set (non-empty)
          for var in INPUT_TOKENS OUTPUT_TOKENS DURATION_MS CACHE_RATIO; do
            val="${!var}"
            if [ -z "$val" ]; then
              echo "FAIL: output $var is empty"
              exit 1
            fi
          done

          # With no AI calls, tokens should be 0
          if [ "$INPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected input-tokens=0 but got '$INPUT_TOKENS'"
            exit 1
          fi
          if [ "$OUTPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected output-tokens=0 but got '$OUTPUT_TOKENS'"
            exit 1
          fi
          if [ "$DURATION_MS" != "0" ]; then
            echo "FAIL: expected duration-ms=0 but got '$DURATION_MS'"
            exit 1
          fi
          echo "PASS: all metric outputs are correct defaults"
