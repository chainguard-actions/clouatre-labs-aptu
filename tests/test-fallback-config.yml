name: Test fallback AI config and behavior flags
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that fallback-provider/model config is written and action completes.
      # The fallback config is written early in the composite action (before binary install).
      # The action may fail at the binary install/attestation step in act environment.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'
          no-comment: 'true'
          apply-labels: 'false'
          dry-run: 'true'

      - name: Assert fallback config was written and action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # The fallback config file is written early in the composite action
          # (before binary install), so it should exist regardless of outcome.
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          echo "Checking for config file at: $CONFIG_FILE"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: fallback config file was not created at $CONFIG_FILE"
            exit 1
          fi
          echo "Config file contents:"
          cat "$CONFIG_FILE"
          if ! grep -q "openrouter" "$CONFIG_FILE"; then
            echo "FAIL: config file does not contain 'openrouter'"
            exit 1
          fi
          if ! grep -q "inception/mercury-2" "$CONFIG_FILE"; then
            echo "FAIL: config file does not contain 'inception/mercury-2'"
            exit 1
          fi
          echo "PASS: fallback config file is correct"

          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded: metric outputs must be set
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: action succeeded but input-tokens output is empty"
              exit 1
            fi
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: action succeeded but cache-hit-ratio output is empty"
              exit 1
            fi
            echo "PASS: metrics outputs are set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (binary install/attestation may not work in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
