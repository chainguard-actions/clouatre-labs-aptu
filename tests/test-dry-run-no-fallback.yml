name: Test dry-run mode with no fallback provider
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup fake gh and aptu for act environment
        run: |
          set -euo pipefail

          # Save the real gh path before we shadow it
          REAL_GH=$(which gh 2>/dev/null || echo "/usr/bin/gh")
          echo "$REAL_GH" > /tmp/real-gh-path

          ARCH_RAW=$(uname -m)
          case "$ARCH_RAW" in
            aarch64|arm64) ARCH="aarch64" ;;
            x86_64)        ARCH="x86_64"  ;;
            *)             ARCH="x86_64"  ;;
          esac

          FAKE_VERSION="0.99.99"
          ARCHIVE="aptu-cli-${FAKE_VERSION}-${ARCH}-unknown-linux-musl.tar.gz"
          SHA256_FILE="aptu-cli-${FAKE_VERSION}-${ARCH}-unknown-linux-musl.sha256"

          mkdir -p /tmp/fake-release

          printf '#!/bin/sh\necho "fake aptu: $*"\nexit 0\n' > /tmp/fake-release/aptu
          chmod +x /tmp/fake-release/aptu

          tar -czf "/tmp/fake-release/${ARCHIVE}" -C /tmp/fake-release aptu
          SHA256=$(sha256sum "/tmp/fake-release/${ARCHIVE}" | awk '{print $1}')
          printf '%s  %s\n' "$SHA256" "$ARCHIVE" > "/tmp/fake-release/${SHA256_FILE}"

          cat > /tmp/fake-gh << 'GH_EOF'
          #!/bin/sh
          ARGS="$*"
          case "$ARGS" in
            *"attestation verify"*)
              echo "Verified provenance (mocked)"
              exit 0
              ;;
            *"repos/clouatre-labs/aptu/releases"*)
              echo "v0.99.99"
              exit 0
              ;;
            *"release download"*)
              DEST=""
              prev=""
              for arg in "$@"; do
                if [ "$prev" = "-D" ]; then
                  DEST="$arg"
                fi
                prev="$arg"
              done
              if [ -n "$DEST" ]; then
                cp /tmp/fake-release/* "$DEST/"
              fi
              exit 0
              ;;
            *)
              REAL_GH=$(cat /tmp/real-gh-path 2>/dev/null || echo "/usr/bin/gh")
              exec "$REAL_GH" "$@"
              ;;
          esac
          GH_EOF
          chmod +x /tmp/fake-gh

          mkdir -p /tmp/fake-bin
          ln -sf /tmp/fake-gh /tmp/fake-bin/gh
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          skip-labeled: 'false'
          # Disable fallback by setting empty string
          fallback-provider: ''
          fallback-model: ''

      - name: Assert no fallback config file was written
        run: |
          CONFIG_FILE="$HOME/.config/aptu/config.toml"
          echo "Checking that config file was NOT written at: $CONFIG_FILE"
          if [ -f "$CONFIG_FILE" ]; then
            echo "Config file contents:"
            cat "$CONFIG_FILE"
            echo "FAIL: fallback config file should not exist when fallback-provider is empty"
            exit 1
          fi
          echo "PASS: no fallback config file written (as expected)"

      - name: Assert zero token metrics when no AI calls made
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          EFFECTIVE_TOKEN_UNITS: ${{ steps.action.outputs.effective-token-units }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "effective-token-units: $EFFECTIVE_TOKEN_UNITS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          # Under workflow_dispatch, no AI steps fire, so all token counts should be 0
          if [ "$INPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected input-tokens=0, got: $INPUT_TOKENS"
            exit 1
          fi
          if [ "$OUTPUT_TOKENS" != "0" ]; then
            echo "FAIL: expected output-tokens=0, got: $OUTPUT_TOKENS"
            exit 1
          fi
          if [ "$DURATION_MS" != "0" ]; then
            echo "FAIL: expected duration-ms=0, got: $DURATION_MS"
            exit 1
          fi
          if [ "$EFFECTIVE_TOKEN_UNITS" != "0" ]; then
            echo "FAIL: expected effective-token-units=0, got: $EFFECTIVE_TOKEN_UNITS"
            exit 1
          fi
          if [ "$CACHE_HIT_RATIO" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio=n/a, got: $CACHE_HIT_RATIO"
            exit 1
          fi
          echo "PASS: all token metrics are zero/n/a as expected for workflow_dispatch with no AI calls"
