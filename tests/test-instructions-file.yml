name: Test instructions-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a sample instructions file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/instructions"
          echo "# PR Review Instructions" > "$GITHUB_WORKSPACE/.github/instructions/pr-review.md"
          echo "Review for correctness and security." >> "$GITHUB_WORKSPACE/.github/instructions/pr-review.md"
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          instructions-file: '.github/instructions/pr-review.md'
          dry-run: 'true'
          no-comment: 'true'
          skip-labeled: 'false'
      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          # Under workflow_dispatch with no PR event, the PR review step does not fire.
          # Verify the outputs are set (not all empty).
          if [ -z "$INPUT_TOKENS" ] && [ -z "$OUTPUT_TOKENS" ] && [ -z "$DURATION_MS" ]; then
            echo "FAIL: all metric outputs are empty"
            exit 1
          fi
          echo "PASS: metric outputs are present"
