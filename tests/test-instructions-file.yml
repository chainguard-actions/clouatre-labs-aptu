name: Test instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a sample instructions file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/instructions"
          cat > "$GITHUB_WORKSPACE/.github/instructions/pr-review.md" <<'EOF'
          # PR Review Instructions
          Please review this PR for correctness and style.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          instructions-file: '.github/instructions/pr-review.md'
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          skip-labeled: 'false'

      - name: Assert action ran and produced metrics outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          echo "input-tokens: $INPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"

          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

          # The metrics-aggregate step always runs; cache-hit-ratio should always be set
          if [ -z "$CACHE_HIT_RATIO" ]; then
            echo "FAIL: cache-hit-ratio output is empty"
            exit 1
          fi
          echo "PASS: metrics outputs present"
