name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          # AI provider API keys — passed for input coverage; no AI steps fire under workflow_dispatch
          anthropic-api-key: 'sk-ant-test-placeholder'
          cerebras-api-key: 'csk-test-placeholder'
          gemini-api-key: 'AIza-test-placeholder'
          groq-api-key: 'gsk_test-placeholder'
          openrouter-api-key: 'sk-or-test-placeholder'
          zai-api-key: 'zai-test-placeholder'
          zenmux-api-key: 'zmx-test-placeholder'
          # instructions-file — passed for input coverage; PR review step does not fire under workflow_dispatch
          instructions-file: 'AGENTS.md'
          # Behavior flags
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          skip-labeled: 'false'
          # Disable scan and pr-queue so no operational steps run
          scan-path: ''
          pr-queue: 'false'

      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # Under workflow_dispatch no AI steps fire, so tokens should be 0
          if [ "$INPUT_TOKENS" != "0" ] && [ -z "$INPUT_TOKENS" ]; then
            echo "FAIL: input-tokens output missing"
            exit 1
          fi
          if [ "$OUTPUT_TOKENS" != "0" ] && [ -z "$OUTPUT_TOKENS" ]; then
            echo "FAIL: output-tokens output missing"
            exit 1
          fi
          if [ "$DURATION_MS" != "0" ] && [ -z "$DURATION_MS" ]; then
            echo "FAIL: duration-ms output missing"
            exit 1
          fi
          if [ -z "$CACHE_HIT_RATIO" ]; then
            echo "FAIL: cache-hit-ratio output missing"
            exit 1
          fi
          echo "PASS: all metric outputs present"
