name: Test basic workflow_dispatch (no AI event)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'

      # The metrics-aggregate step in the action runs with if: always(),
      # so outputs are set even if binary installation fails.
      # Under workflow_dispatch, no AI calls are made, so metrics are zeros.
      - name: Assert input-tokens is 0
        if: always()
        env:
          ACTUAL: ${{ steps.action.outputs.input-tokens }}
        run: |
          echo "actual input-tokens: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected input-tokens=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert output-tokens is 0
        if: always()
        env:
          ACTUAL: ${{ steps.action.outputs.output-tokens }}
        run: |
          echo "actual output-tokens: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected output-tokens=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert duration-ms is 0
        if: always()
        env:
          ACTUAL: ${{ steps.action.outputs.duration-ms }}
        run: |
          echo "actual duration-ms: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected duration-ms=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert cache-hit-ratio is n/a
        if: always()
        env:
          ACTUAL: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "actual cache-hit-ratio: $ACTUAL"
          if [ "$ACTUAL" != "n/a" ]; then
            echo "FAIL: expected cache-hit-ratio=n/a, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert effective-token-units is 0
        if: always()
        env:
          ACTUAL: ${{ steps.action.outputs.effective-token-units }}
        run: |
          echo "actual effective-token-units: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected effective-token-units=0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
