name: Test AI provider API keys coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: 'test-anthropic-key'
          cerebras-api-key: 'test-cerebras-key'
          gemini-api-key: 'test-gemini-key'
          groq-api-key: 'test-groq-key'
          openrouter-api-key: 'test-openrouter-key'
          zai-api-key: 'test-zai-key'
          zenmux-api-key: 'test-zenmux-key'
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          pr-queue: 'false'

      - name: Assert metrics outputs are set
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # The action either succeeds (aptu installed, no AI steps fired under workflow_dispatch)
          # or fails gracefully (e.g. cannot resolve aptu release via sentinel repo token).
          # In both cases, the metrics-aggregate step runs with if: always() and sets outputs.
          if [ "$OUTCOME" = "success" ]; then
            # Metrics outputs should be numeric zeros (no AI calls fired)
            if [ "$INPUT_TOKENS" != "0" ] && [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: expected input-tokens to be set"
              exit 1
            fi
            echo "PASS: action succeeded with API key inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
