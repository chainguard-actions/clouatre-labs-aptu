name: Test API keys and instructions-file input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          anthropic-api-key: "fake-anthropic-key"
          cerebras-api-key: "fake-cerebras-key"
          gemini-api-key: "fake-gemini-key"
          groq-api-key: "fake-groq-key"
          openrouter-api-key: "fake-openrouter-key"
          zai-api-key: "fake-zai-key"
          zenmux-api-key: "fake-zenmux-key"
          instructions-file: ""
          dry-run: "true"
          no-comment: "true"
          apply-labels: "false"
          pr-queue: "false"

      - name: Assert metrics outputs are present
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # Under workflow_dispatch with no issue/PR event, no AI calls are made.
          # Metrics should be zero or n/a (no JSONL file written).
          if [ -z "$INPUT_TOKENS" ] && [ -z "$OUTPUT_TOKENS" ] && [ -z "$DURATION_MS" ]; then
            echo "FAIL: expected metrics outputs to be set (even if zero)"
            exit 1
          fi

          echo "PASS: metrics outputs are present"

      - name: Assert cache-hit-ratio output is set
        env:
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          if [ -z "$CACHE_HIT_RATIO" ]; then
            echo "FAIL: cache-hit-ratio output should be set (expected 'n/a' or a percentage)"
            exit 1
          fi
          echo "PASS: cache-hit-ratio is '$CACHE_HIT_RATIO'"
