name: Test scan-security with dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          scan-path: '.'
          sarif-upload: 'false'

      - name: Assert action ran (scan-security step fired or binary install failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The scan-security step fires because scan-path is set.
          # With dry-run=true and a real aptu binary, the scan may succeed or fail
          # depending on what aptu finds or if the binary install failed.
          # Either outcome is acceptable as long as the action ran (not skipped).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME), scan-security step was triggered"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
