name: Test dry-run and no-comment flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that dry-run and no-comment flags are accepted without error.
      # Under workflow_dispatch, no issue/PR steps fire, so the action installs
      # aptu and outputs zero metrics. The flags are validated by the action's
      # shell steps when they do fire.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'
          no-comment: 'true'
          apply-labels: 'false'
          skip-labeled: 'false'

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert metrics outputs on success
        env:
          ETU: ${{ steps.action.outputs.effective-token-units }}
          COST_USD: ${{ steps.action.outputs.cost-usd }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "effective-token-units: $ETU"
          echo "cost-usd: '$COST_USD'"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          if [ "$OUTCOME" = "success" ]; then
            # On success, all numeric metrics should be zero (no AI calls under workflow_dispatch)
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: input-tokens output is empty on success"
              exit 1
            fi
            if [ "$INPUT_TOKENS" != "0" ]; then
              echo "FAIL: expected input-tokens=0, got '$INPUT_TOKENS'"
              exit 1
            fi
            if [ -z "$OUTPUT_TOKENS" ]; then
              echo "FAIL: output-tokens output is empty on success"
              exit 1
            fi
            if [ "$OUTPUT_TOKENS" != "0" ]; then
              echo "FAIL: expected output-tokens=0, got '$OUTPUT_TOKENS'"
              exit 1
            fi
            if [ -z "$DURATION_MS" ]; then
              echo "FAIL: duration-ms output is empty on success"
              exit 1
            fi
            if [ "$DURATION_MS" != "0" ]; then
              echo "FAIL: expected duration-ms=0, got '$DURATION_MS'"
              exit 1
            fi
            if [ -z "$ETU" ]; then
              echo "FAIL: effective-token-units output is empty on success"
              exit 1
            fi
            if [ "$ETU" != "0" ]; then
              echo "FAIL: expected effective-token-units=0, got '$ETU'"
              exit 1
            fi
            echo "PASS: all numeric metrics are 0 as expected (no AI calls under workflow_dispatch)"
          else
            echo "PASS: action failed gracefully (binary install/attestation may not be available in act)"
          fi
