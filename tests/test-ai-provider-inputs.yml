name: Test AI provider inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          # AI provider API keys — all passed to ensure input coverage
          anthropic-api-key: 'test-anthropic-key'
          cerebras-api-key: 'test-cerebras-key'
          gemini-api-key: 'test-gemini-key'
          groq-api-key: 'test-groq-key'
          openrouter-api-key: 'test-openrouter-key'
          zai-api-key: 'test-zai-key'
          zenmux-api-key: 'test-zenmux-key'
          # instructions-file input coverage
          instructions-file: 'AGENTS.md'
          # Use dry-run to avoid making real changes
          dry-run: 'true'
          # Disable fallback to keep config simple
          fallback-provider: ''
          fallback-model: ''
          # Skip labeled default behavior
          skip-labeled: 'true'

      - name: Assert metrics outputs are set
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          # Metrics aggregate always runs; outputs should be set (numeric or n/a)
          if [ -z "$INPUT_TOKENS" ]; then
            echo "FAIL: input-tokens output is empty"
            exit 1
          fi
          if [ -z "$OUTPUT_TOKENS" ]; then
            echo "FAIL: output-tokens output is empty"
            exit 1
          fi
          if [ -z "$DURATION_MS" ]; then
            echo "FAIL: duration-ms output is empty"
            exit 1
          fi
          if [ -z "$CACHE_HIT_RATIO" ]; then
            echo "FAIL: cache-hit-ratio output is empty"
            exit 1
          fi
          echo "PASS: all metrics outputs are set"
