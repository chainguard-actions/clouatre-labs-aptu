name: Test AI provider inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy instructions file
        run: |
          mkdir -p /tmp/aptu-test
          echo "# PR Review Instructions" > /tmp/aptu-test/instructions.md

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          # AI provider API keys — all covered in this test
          anthropic-api-key: 'dummy-anthropic-key'
          cerebras-api-key: 'dummy-cerebras-key'
          gemini-api-key: 'dummy-gemini-key'
          groq-api-key: 'dummy-groq-key'
          openrouter-api-key: 'dummy-openrouter-key'
          zai-api-key: 'dummy-zai-key'
          zenmux-api-key: 'dummy-zenmux-key'
          # instructions-file input covered here
          instructions-file: '/tmp/aptu-test/instructions.md'
          # Use dry-run to avoid real side effects
          dry-run: 'true'
          # skip-labeled false so check-skip step doesn't short-circuit
          skip-labeled: 'false'
          # No AI event triggered under workflow_dispatch, so AI steps are skipped
          provider: 'openrouter'
          model: 'mistralai/mistral-small-2603'
          fallback-provider: 'openrouter'
          fallback-model: 'inception/mercury-2'

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"

          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — verify metrics outputs are set
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: action succeeded but input-tokens output is empty"
              exit 1
            fi
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: action succeeded but cache-hit-ratio output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with metrics outputs set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under workflow_dispatch with dummy keys)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
