name: Test basic usage (workflow_dispatch - no AI subcommand fires)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}

      - name: Assert action ran (succeeded or failed gracefully on install/attestation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INPUT_TOKENS: ${{ steps.action.outputs.input-tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output-tokens }}
          DURATION_MS: ${{ steps.action.outputs.duration-ms }}
          CACHE_HIT_RATIO: ${{ steps.action.outputs.cache-hit-ratio }}
          ETU: ${{ steps.action.outputs.effective-token-units }}
        run: |
          echo "outcome: $OUTCOME"
          echo "input-tokens: $INPUT_TOKENS"
          echo "output-tokens: $OUTPUT_TOKENS"
          echo "duration-ms: $DURATION_MS"
          echo "cache-hit-ratio: $CACHE_HIT_RATIO"
          echo "effective-token-units: $ETU"

          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded: verify all metric outputs are set and numeric
            for val in "$INPUT_TOKENS" "$OUTPUT_TOKENS" "$DURATION_MS" "$ETU"; do
              if ! echo "$val" | grep -qE '^[0-9]+$'; then
                echo "FAIL: expected numeric output, got '$val'"
                exit 1
              fi
            done
            if [ -z "$CACHE_HIT_RATIO" ]; then
              echo "FAIL: cache-hit-ratio is empty"
              exit 1
            fi
            # Under workflow_dispatch no AI subcommand fires, so metrics should be zero
            if [ "$INPUT_TOKENS" != "0" ]; then
              echo "FAIL: expected input-tokens=0 (no AI call), got '$INPUT_TOKENS'"
              exit 1
            fi
            if [ "$OUTPUT_TOKENS" != "0" ]; then
              echo "FAIL: expected output-tokens=0 (no AI call), got '$OUTPUT_TOKENS'"
              exit 1
            fi
            if [ "$CACHE_HIT_RATIO" != "n/a" ]; then
              echo "FAIL: expected cache-hit-ratio=n/a (no AI call), got '$CACHE_HIT_RATIO'"
              exit 1
            fi
            echo "PASS: action succeeded with zero metrics as expected"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely gh attestation verify not supported in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
